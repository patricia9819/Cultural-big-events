<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vegan Life 我的素食地圖</title>
<meta name="theme-color" content="#3f8f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="素食地圖">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
:root {
  --bg: #f6f7f2; --card: #ffffff; --text: #1f2a1f; --muted: #66705f; --line: #dde3d6;
  --accent: #3f8f4a; --accent-soft: #e4f2e2; --warn: #b5651d; --warn-soft: #fbeee0;
  --chip: #eef1ea; --heart: #e8435a; --brand-bg: transparent;
  --c-pure: #2e7d32; --c-pure5: #8bc34a; --c-mix5: #f08c00; --c-none: #9aa3a0;
  --sh: 0 1px 3px rgba(0,0,0,.08); --sh-hover: 0 10px 24px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141814; --card: #1d231d; --text: #e6ece3; --muted: #9aa695; --line: #2e372d;
    --accent: #6cc177; --accent-soft: #233a25; --warn: #e0a060; --warn-soft: #3a2b1c;
    --chip: #262e25; --sh: 0 1px 3px rgba(0,0,0,.4); --sh-hover: 0 12px 28px rgba(0,0,0,.6); --brand-bg: #eef4ea;
  }
}
:root[data-theme="dark"] {
  --bg: #141814; --card: #1d231d; --text: #e6ece3; --muted: #9aa695; --line: #2e372d;
  --accent: #6cc177; --accent-soft: #233a25; --warn: #e0a060; --warn-soft: #3a2b1c;
  --chip: #262e25; --sh: 0 1px 3px rgba(0,0,0,.4); --sh-hover: 0 12px 28px rgba(0,0,0,.6); --brand-bg: #eef4ea;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
header { padding: 10px 16px 10px; background: var(--card); border-bottom: 1px solid var(--line); }
.top { position: relative; display: flex; justify-content: center; }
.brand { margin: 0; line-height: 0; padding: 4px 14px; border-radius: 18px; background: var(--brand-bg); }
.brand img { height: 128px; width: auto; display: block; transition: height .3s ease; }
.sub { transition: opacity .2s; }
/* 往下捲時頂部收合：logo 縮小、隱藏同步時間 */
header.mini .brand img { height: 46px; }
header.mini .sub { display: none; }
header.mini .controls { margin-top: 6px; }
header.mini .top .sync-btn { top: 50%; transform: translateY(-50%); font-size: 0; padding: 6px 9px; }
header.mini .top .sync-btn::first-letter { font-size: .95rem; }

/* 城市按鈕 */
.cities { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.cities::-webkit-scrollbar { display: none; }
.city { flex: none; border: 0; background: none; padding: 7px 12px; border-radius: 999px; font-size: .95rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: background-color .2s, color .2s; }
.city .n { font-size: .78rem; font-weight: 500; margin-left: 4px; opacity: .8; }
.city[aria-pressed="true"] { background: var(--text); color: var(--card); }
@media (hover: hover) { .city:not([aria-pressed="true"]):hover { background: var(--chip); color: var(--text); } }
/* 區域標籤 */
.areas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; padding: 2px 0; }
.areas::-webkit-scrollbar { display: none; }
.areas .lbl { flex: none; font-size: .78rem; color: var(--muted); margin-right: 2px; }
.area { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 10px; font-size: .82rem; cursor: pointer; color: var(--text); }
.area .n { color: var(--muted); margin-left: 3px; font-size: .75rem; }
.area[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: grid; place-items: center; font-size: 1.05rem; }

/* 分段標題（捲動時固定在上方） */
.sec-h { grid-column: 1 / -1; position: sticky; top: -14px; z-index: 3; display: flex; align-items: baseline; gap: 8px; padding: 10px 2px 6px; margin-bottom: -4px;
  background: var(--bg); box-shadow: 0 6px 6px -6px rgba(0,0,0,.12); font-size: .95rem; }
.sec-h b { font-size: 1rem; }
.sec-h span { color: var(--muted); font-size: .8rem; }
.sec-h:not(:first-child) { margin-top: 8px; }

/* 精簡卡片：左邊小照片、右邊資訊 */
.card.mini .lift { flex-direction: row; }
.thumb { flex: none; width: 96px; background: var(--chip); position: relative; }
.thumb img, .thumb .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.mbody { flex: 1; min-width: 0; padding: 9px 10px 9px 12px; display: flex; flex-direction: column; gap: 4px; }
.mbody .title h3 { font-size: .95rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mbody .heart { margin: -4px -4px 0 0; }
.mline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .76rem; }
.mnote { font-size: .82rem; line-height: 1.45; color: var(--text); background: var(--accent-soft); border-radius: 6px; padding: 3px 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mbody .meta { font-size: .76rem; }

/* 地圖：合併圓點（外圈顏色＝各分類比例） */
.cluwrap { background: none; border: 0; }
.clu { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; }
.clu span { width: 68%; height: 68%; border-radius: 50%; background: #fff; color: #1f2a1f; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
@media (hover: hover) { .cluwrap:hover .clu { transform: translateY(-4px) scale(1.08); box-shadow: 0 8px 18px rgba(0,0,0,.4); } }
.top .sync-btn { position: absolute; right: 0; top: 0; }
.sub { color: var(--muted); font-size: .75rem; margin-top: 4px; line-height: 1.5; text-align: center; }
.sync-btn { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 10px; font-size: .78rem; cursor: pointer; white-space: nowrap; }
.sync-btn.ok { color: var(--accent); }
.sync-btn.err { color: var(--warn); }
.banner { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: .82rem; line-height: 1.5; }
.controls { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input, select, textarea { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
/* 搜尋：平常只有放大鏡，點了向左展開 */
.searchrow { position: relative; min-height: 44px; padding-right: 52px; flex-wrap: nowrap; }
#sortSel { min-width: 0; flex: 0 1 auto; text-overflow: ellipsis; }
.search { position: absolute; right: 0; top: 50%; transform: translateY(-50%); height: 44px; width: 44px; display: flex; align-items: center;
  border-radius: 999px; background: var(--card); border: 1px solid var(--line); overflow: hidden; z-index: 5;
  transition: width .35s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 0 0 16px; height: 100%; opacity: 0; transition: opacity .2s .1s; outline: none; }
.search-btn { flex: none; width: 42px; height: 42px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--accent); }
.search-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.search.open { width: 100%; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search.open input { opacity: 1; }
.search:not(.open) input { flex: 0 0 0; padding: 0; }
.searchrow > select { transition: opacity .2s; }
.searchrow.searching > select { opacity: 0; pointer-events: none; }
.search.has-q:not(.open) { border-color: var(--accent); background: var(--accent-soft); }
@media (hover: hover) { .search:not(.open):hover { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 2px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 9%, var(--card));
  border-radius: 999px; padding: 8px 15px; font-size: .9rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .25s ease, border-color .2s, background-color .2s; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.chip .n { color: var(--muted); font-weight: 500; font-size: .82rem; }
.chip:focus-visible { outline: none; }
.chip:focus-visible, .chip:active { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent), 0 6px 18px color-mix(in srgb, var(--c) 40%, transparent); }
@media (hover: hover) {
  .chip:hover { border-color: var(--c); transform: translateY(-2px);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent), 0 6px 20px color-mix(in srgb, var(--c) 45%, transparent); }
}
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 45%, transparent); }
.chip[aria-pressed="true"] i { background: #fff; box-shadow: none; }
.chip[aria-pressed="true"] .n { color: rgba(255,255,255,.9); }
.tabs { display: flex; gap: 4px; background: var(--chip); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 16px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: var(--sh); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: .88rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--warn); }
.count { color: var(--muted); font-size: .85rem; margin-left: auto; }
main { flex: 1; min-height: 0; position: relative; }
#list { height: 100%; overflow-y: auto; padding: 14px 16px 40px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); align-content: start; }
#list.dense { gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
#map { position: absolute; inset: 0; }
.hidden { display: none !important; }

/* 卡片 */
.card { cursor: pointer; outline: none; border-radius: 14px; }
.lift { height: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--sh); display: flex; flex-direction: column;
  transition: transform .2s ease, box-shadow .2s ease; }
.card:focus-visible .lift { transform: translateY(-5px); box-shadow: var(--sh-hover); }
@media (hover: hover) { .card:hover .lift { transform: translateY(-5px); box-shadow: var(--sh-hover); } }
@media (hover: none) { .card:active .lift { transform: translateY(-3px) scale(.99); box-shadow: var(--sh-hover); } }
.card:focus-visible .lift { border-color: var(--accent); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); height: 150px; overflow: hidden; }
.photos img, .photos .ph { width: 100%; height: 150px; min-width: 0; object-fit: cover; display: block; background: var(--chip); }
.photos .ph { display: flex; align-items: center; justify-content: center; font-size: 1.6rem; opacity: .55; }
.body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.title { display: flex; align-items: flex-start; gap: 8px; }
.title h3 { margin: 0; font-size: 1rem; flex: 1; line-height: 1.35; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--c); align-self: flex-start; }
.badge.none { background: var(--chip); color: var(--muted); }
.note { white-space: pre-wrap; background: var(--accent-soft); border-radius: 8px; padding: 7px 9px; font-size: .9rem; line-height: 1.5; }
.notelink { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
.note.empty { background: transparent; color: var(--muted); padding: 0; font-style: italic; font-size: .85rem; }
.meta { color: var(--muted); font-size: .8rem; line-height: 1.5; }
.open { font-weight: 600; }
.open.yes { color: var(--accent); } .open.no { color: var(--warn); }
.visited { font-size: .8rem; color: var(--text); }
.quick { display: flex; gap: 8px; margin-top: 2px; }
.quick button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: .82rem; cursor: pointer; }

/* 愛心 */
.heart { position: relative; border: 0; background: none; padding: 4px; cursor: pointer; line-height: 0; flex: none; -webkit-tap-highlight-color: transparent; }
.heart svg { width: 24px; height: 24px; display: block; fill: none; stroke: var(--muted); stroke-width: 2; transition: fill .15s, stroke .15s; }
.heart[aria-pressed="true"] svg { fill: var(--heart); stroke: var(--heart); }
.heart.pop svg { animation: heartPop .5s cubic-bezier(.17,.89,.32,1.49); }
@keyframes heartPop { 0% { transform: scale(1); } 25% { transform: scale(1.55); } 55% { transform: scale(.85); } 75% { transform: scale(1.12); } 100% { transform: scale(1); } }
.particle { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; pointer-events: none; animation: burst .75s cubic-bezier(.2,.7,.3,1) forwards; }
.particle svg { width: 100%; height: 100%; fill: var(--pc); stroke: none; animation: none !important; }
@keyframes burst {
  0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
}

/* 地圖圓點 */
.dotwrap { background: none; border: 0; }
.dot { display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; }
.dot.liked::after { content: "♥"; position: absolute; top: -9px; right: -8px; font-size: 11px; color: var(--heart); text-shadow: 0 0 2px #fff; }
.dot { position: relative; }
@media (hover: hover) { .dotwrap:hover .dot { transform: translateY(-5px) scale(1.15); box-shadow: 0 8px 16px rgba(0,0,0,.4); } }
.dot.flash { transform: translateY(-5px) scale(1.15); box-shadow: 0 8px 16px rgba(0,0,0,.4); }
.legend { background: var(--card); color: var(--text); padding: 8px 10px; border-radius: 10px; box-shadow: var(--sh); font-size: .78rem; line-height: 1.8; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 6px; }

/* 詳情視窗 */
dialog { border: 0; padding: 0; border-radius: 16px; background: var(--card); color: var(--text); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog[open] { animation: dlgIn .28s cubic-bezier(.2,.8,.25,1); }
dialog[open]::backdrop { animation: fadeIn .28s ease; }
dialog.closing { animation: dlgOut .22s ease-in forwards; }
dialog.closing::backdrop { animation: fadeOut .22s ease-in forwards; }
@keyframes dlgIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
@keyframes dlgOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(.9); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
.sheet { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.sheet .scroll { overflow-y: auto; }
.sheet .photos, .sheet .photos img, .sheet .photos .ph { height: 230px; }
.close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 1.1rem; cursor: pointer; }
.sec { padding: 12px 16px; border-top: 1px solid var(--line); }
.sec h4 { margin: 0 0 8px; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.sec h4 .btn { margin-left: auto; padding: 4px 10px; font-size: .8rem; }
.hours { width: 100%; border-collapse: collapse; font-size: .88rem; }
.hours td { padding: 4px 6px; }
.hours td:first-child { color: var(--muted); width: 5em; }
.hours tr.today td { background: var(--accent-soft); font-weight: 600; color: var(--text); }
.hours tr.today td:first-child { border-radius: 6px 0 0 6px; } .hours tr.today td:last-child { border-radius: 0 6px 6px 0; }
.visits { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.visits li { display: flex; gap: 8px; align-items: baseline; font-size: .88rem; background: var(--chip); border-radius: 8px; padding: 6px 10px; }
.visits li b { white-space: nowrap; }
.visits li span { flex: 1; color: var(--muted); }
.visits li button { border: 0; background: none; color: var(--muted); cursor: pointer; }
.addvisit { display: flex; gap: 6px; flex-wrap: wrap; }
.addvisit input[type=date] { flex: 0 0 auto; }
.addvisit input[type=text] { flex: 1 1 140px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a, .links button { text-decoration: none; color: var(--accent); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: .88rem; background: var(--card); cursor: pointer; }
.edit { display: flex; flex-direction: column; gap: 8px; }
.edit label { font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.edit textarea { min-height: 80px; resize: vertical; }
.hint { font-size: .78rem; color: var(--muted); line-height: 1.5; }
.steps { margin: 0; padding-left: 1.3em; font-size: .88rem; line-height: 1.7; }
.steps a { color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: .85rem; z-index: 9999; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .92; }
.empty-state { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0; }
@media (max-width: 520px) {
  header { padding: 10px 12px 8px; }
  h1 { font-size: 1.1rem; }
  .sub { font-size: .72rem; }
  .controls { gap: 6px; margin-top: 8px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 6px 12px; }
  .cities, .areas { margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
  .tabs button { padding: 6px 10px; }
  #sortSel { padding: 8px 6px; flex: 1 1 0; }
  .tabs button { white-space: nowrap; }
  .tabs .ti { display: none; }
  #list.dense { grid-template-columns: 1fr; }
  .brand img { height: 96px; }
  header.mini .brand img { height: 36px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 12px; font-size: .84rem; }
  .tabs button { padding: 6px 14px; }
  #list { grid-template-columns: 1fr; padding: 12px; }
  .sec-h { top: -12px; }
  dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 16px 16px 0 0; }
  .sheet { max-height: 92vh; }
}
@media (prefers-reduced-motion: reduce) {
  .lift, .dot { transition: none; }
  .heart.pop svg, .particle, dialog[open], dialog.closing, dialog::backdrop { animation-duration: .01s !important; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 class="brand"><img src="logo.webp" alt="My Vegan Life 我的素食地圖" width="900" height="775"></h1>
    <button class="sync-btn" id="syncBtn" title="跨裝置同步設定">📱 只存在這台裝置</button>
  </div>
  <div class="sub" id="updated">載入中…</div>
  <div class="banner hidden" id="banner"></div>
  <div class="controls">

<script>
/* ========= 設定 ========= */
const REPO = { owner: 'patricia9819', repo: 'Cultural-big-events', branch: 'main', path: 'veggie/mydata.json' };
const CATS = {
  pure:  { label: '全素無五辛',   color: 'var(--c-pure)',  hex: '#2e7d32' },
  pure5: { label: '全素可去五辛', color: 'var(--c-pure5)', hex: '#8bc34a' },
  mix5:  { label: '葷素可去五辛', color: 'var(--c-mix5)',  hex: '#f08c00' },
};
// 沒有手動指定分類時，依備註自動判斷
function autoCat(text) {
  if (/葷|有素|素食友善|素食選項|素食菜單|鍋邊|可做素/.test(text)) return 'mix5';
  if (/無五辛|不含五辛|沒有五辛|不加五辛/.test(text)) return 'pure';
  if (/可去五辛|可以去五辛|去五辛|五辛可去/.test(text)) return 'pure5';
  return null;
}
const HEART_PATH = 'M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.8 4.2 7.2C19.5 16.4 12 21 12 21z';
const LS_DATA = 'veggie-mydata', LS_TOKEN = 'veggie-gh-token', LS_VIEW = 'veggie-view';

/* ========= 小工具 ========= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 備註裡的網址變成可點的連結（新視窗開啟）
const URL_RE = /(https?:\/\/[^\s<>"'，。、；！？（）「」【】\u3000]+|www\.[^\s<>"'，。、；！？（）「」【】\u3000]+)/gi;
function linkify(text) {
  return String(text ?? '').split(URL_RE).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const m = part.match(/^(.*?)([.,!?:;)\]]*)$/);
    const url = m[1], tail = m[2];
    const href = /^https?:/i.test(url) ? url : 'https://' + url;
    const label = url.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    return `<a class="notelink" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label.length > 40 ? label.slice(0, 38) + '…' : label)} ↗</a>${esc(tail)}`;
  }).join('');
}
const safeUrl = u => (/^(https?:\/\/|photos\/)/i.test(u || '') ? u : '');
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function distKm(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${y}/${+m}/${+dd}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));

/* ========= 我的資料（備註編輯、去過紀錄、愛心） ========= */
// 每間店一筆：{ note?, category?, visits: [{date, memo}], liked, photos?, t: 最後修改時間 }
let my = { places: {} };
let mySha = null, pushTimer = null, syncState = 'local';

function mergeMy(a, b) {
  const out = { places: { ...a.places } };
  for (const [id, e] of Object.entries(b.places || {})) if (!out.places[id] || (e.t || 0) > (out.places[id].t || 0)) out.places[id] = e;
  return out;
}
const token = () => ls.get(LS_TOKEN);
const apiUrl = () => `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}`;
const ghHeaders = () => ({ Authorization: `Bearer ${token()}`, Accept: 'application/vnd.github+json' });

async function fetchRemote() {
  if (token()) {
    const r = await fetch(`${apiUrl()}?ref=${REPO.branch}&t=${Date.now()}`, { headers: ghHeaders(), cache: 'no-store' });
    if (r.status === 404) { mySha = null; return { places: {} }; }
    if (!r.ok) throw new Error(r.status === 401 ? '同步密碼無效或過期' : `GitHub 回應 ${r.status}`);
    const j = await r.json(); mySha = j.sha;
    return JSON.parse(b64dec(j.content));
  }
  const r = await fetch('mydata.json?t=' + Date.now());
  return r.ok ? r.json() : { places: {} };
}
async function loadMy() {
  let local = { places: {} };
  try { local = JSON.parse(ls.get(LS_DATA)) || local; } catch (e) {}
  let remote = { places: {} };
  try { remote = await fetchRemote(); setSync(token() ? 'ok' : 'local'); }
  catch (e) { setSync('err', e.message); }
  my = mergeMy(remote, local);
  ls.set(LS_DATA, JSON.stringify(my));
  // 本機有比雲端新的變更 → 補上傳
  if (token() && syncState === 'ok' && Object.entries(local.places).some(([id, e]) => (e.t || 0) > (remote.places?.[id]?.t || 0))) schedulePush();
}
function saveMy(id, patch) {
  const e = my.places[id] || { visits: [] };
  my.places[id] = { ...e, ...patch, t: Date.now() };
  ls.set(LS_DATA, JSON.stringify(my));
  if (token()) schedulePush();
}
function schedulePush() { clearTimeout(pushTimer); setSync('busy'); pushTimer = setTimeout(pushRemote, 900); }
async function pushRemote(retry = true) {
  try {
    const remote = await fetchRemote();
    my = mergeMy(my, remote); my = mergeMy(remote, my);
    const body = { message: '素食地圖：更新我的備註與紀錄', content: b64enc(JSON.stringify({ ...my, updated: new Date().toISOString() }, null, 1) + '\n'), branch: REPO.branch };
    if (mySha) body.sha = mySha;
    const r = await fetch(apiUrl(), { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if ((r.status === 409 || r.status === 422) && retry) return pushRemote(false);
    if (!r.ok) throw new Error(r.status === 403 || r.status === 404 ? '同步密碼沒有寫入權限' : `GitHub 回應 ${r.status}`);
    mySha = (await r.json()).content.sha;
    ls.set(LS_DATA, JSON.stringify(my));
    setSync('ok');
  } catch (e) { setSync('err', e.message); }
}
function setSync(state, msg) {
  syncState = state;
  const b = $('syncBtn');
  b.className = 'sync-btn' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  b.textContent = { local: '📱 只存在這台裝置', ok: '☁️ 已同步', busy: '⏳ 同步中…', err: '⚠️ 同步失敗' }[state];
  b.title = msg || '跨裝置同步設定';
}

/* ========= 店家資料 ========= */
const S = { places: [], q: '', list: '', area: '', cats: new Set(), me: null, view: 'list', sort: 'name', dense: true };
const cityName = list => list === '其他收藏' ? '其他' : list.replace(/素食$/, '') || list;
const primaryList = p => p.lists.find(l => l !== '其他收藏') || p.lists[0] || '';
const areaKey = p => { if (!p.area) return '其他'; const a = p.area.split('・'); return a[1] || a[0]; };
let LISTS = []; // 依店家數排序的清單（城市）
function eff(p) {
  const m = my.places[p.id] || {};
  const note = m.note ?? p.note ?? '';
  const visits = [...(m.visits || [])].sort((a, b) => b.date.localeCompare(a.date));
  const photos = (m.photos && m.photos.filter(Boolean).length ? m.photos : p.photos || []).map(safeUrl).filter(Boolean);
  return { ...p, note, noteEdited: m.note != null && m.note !== p.note, cat: m.category || autoCat(`${note} ${p.name}`), catManual: !!m.category, visits, liked: !!m.liked, photos };
}

/* 營業時間：依店家所在地的時區判斷今天與是否營業中 */
function placeTZ(p) {
  if (/日本/.test(p.address) || (p.lng > 128 && p.lng < 146 && p.lat > 24 && p.lat < 46)) return 'Asia/Tokyo';
  if (p.lng > 119 && p.lng < 122.5 && p.lat > 21 && p.lat < 26.5) return 'Asia/Taipei';
  return undefined;
}
function nowIn(tz) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { day: { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[parts.weekday], min: +parts.hour * 60 + +parts.minute };
}
function openStatus(p) {
  if (!p.hours || !p.hours.length) return null;
  const n = nowIn(placeTZ(p));
  const today = p.hours.find(h => h.day === n.day);
  if (!today) return null;
  if (/休息|公休/.test(today.text)) return { open: false, today };
  if (/24\s*小時/.test(today.text)) return { open: true, today };
  const re = /(\d{1,2}):(\d{2})\s*[–\-~]\s*(\d{1,2}):(\d{2})/g; let m, open = false;
  while ((m = re.exec(today.text))) {
    const s = +m[1] * 60 + +m[2]; let e = +m[3] * 60 + +m[4]; if (e <= s) e += 1440;
    if (n.min >= s && n.min < e) open = true;
  }
  return { open, today };
}

/* 地址 → 城市・區域（例：東京・台東區、橫濱・中區、台北市・大安區） */
const TOKYO_WARDS = { Chiyoda: '千代田區', Chuo: '中央區', Minato: '港區', Shinjuku: '新宿區', Bunkyo: '文京區', Taito: '台東區', Sumida: '墨田區', Koto: '江東區',
  Shinagawa: '品川區', Meguro: '目黑區', Ota: '大田區', Setagaya: '世田谷區', Shibuya: '澀谷區', Nakano: '中野區', Suginami: '杉並區', Toshima: '豐島區', Kita: '北區',
  Arakawa: '荒川區', Itabashi: '板橋區', Nerima: '練馬區', Adachi: '足立區', Katsushika: '葛飾區', Edogawa: '江戶川區' };
const YOKOHAMA_WARDS = { Naka: '中區', Nishi: '西區', Kanagawa: '神奈川區', Minami: '南區', Kohoku: '港北區', Tsurumi: '鶴見區', Hodogaya: '保土谷區', Isogo: '磯子區',
  Kanazawa: '金澤區', Totsuka: '戶塚區', Konan: '港南區', Asahi: '旭區', Midori: '綠區', Seya: '瀨谷區', Sakae: '榮區', Izumi: '泉區', Aoba: '青葉區', Tsuzuki: '都筑區' };
const CITY_WARDS = {
  '京都': { Nakagyo: '中京區', Shimogyo: '下京區', Higashiyama: '東山區', Kamigyo: '上京區', Sakyo: '左京區', Ukyo: '右京區', Minami: '南區', Kita: '北區',
    Fushimi: '伏見區', Yamashina: '山科區', Nishikyo: '西京區' },
  '神戶': { Chuo: '中央區', Kita: '北區', Nada: '灘區', Higashinada: '東灘區', Hyogo: '兵庫區', Nagata: '長田區', Suma: '須磨區', Tarumi: '垂水區', Nishi: '西區' },
  '大阪': { Kita: '北區', Chuo: '中央區', Naniwa: '浪速區', Tennoji: '天王寺區', Nishi: '西區', Fukushima: '福島區', Yodogawa: '淀川區', Miyakojima: '都島區',
    Nishinari: '西成區', Abeno: '阿倍野區', Minato: '港區', Taisho: '大正區', Higashinari: '東成區', Ikuno: '生野區', Joto: '城東區', Asahi: '旭區', Sumiyoshi: '住吉區',
    Konohana: '此花區', Nishiyodogawa: '西淀川區', Higashiyodogawa: '東淀川區', Suminoe: '住之江區', Hirano: '平野區', Tsurumi: '鶴見區', Higashisumiyoshi: '東住吉區' },
};
const JP_CITIES = { Tokyo: '東京', Yokohama: '橫濱', Kamakura: '鎌倉', Kyoto: '京都', Osaka: '大阪', Nagoya: '名古屋', Sapporo: '札幌', Fukuoka: '福岡', Kobe: '神戶', Nara: '奈良', Kawasaki: '川崎', Hakone: '箱根',
  Kawagoe: '川越', Saitama: '埼玉', Chiba: '千葉', Narita: '成田', Nikko: '日光', Karuizawa: '輕井澤', Fujisawa: '藤澤', Odawara: '小田原', Atami: '熱海', Hiroshima: '廣島',
  Sendai: '仙台', Kanazawa: '金澤', Okinawa: '沖繩', Naha: '那霸', Hakodate: '函館', Otaru: '小樽', Takayama: '高山', Matsumoto: '松本', Shizuoka: '靜岡', Himeji: '姬路' };
const JP_PREFS = /^(Tokyo|Kanagawa|Saitama|Chiba|Osaka|Kyoto|Hyogo|Aichi|Hokkaido|Fukuoka|Okinawa|Nara|Shizuoka|Nagano|Tochigi|Gunma|Ibaraki|Miyagi|Hiroshima|Ishikawa|Gifu)$/;
function areaOf(addr) {
  if (!addr) return '';
  const tw = addr.match(/([\u4e00-\u9fa5]{2}[市縣])([\u4e00-\u9fa5]{1,3}?[區鄉鎮市])/);
  if (tw && !/日本/.test(addr)) return `${tw[1]}・${tw[2]}`;
  // 日文漢字地址：大阪市中央区、京都市中京区…
  const jp = addr.match(/(東京都?|大阪|京都|神戸|横浜|名古屋)市?([^\s,、市]{1,4}?)区/);
  if (jp) return `${{ 東京都: '東京', 神戸: '神戶', 横浜: '橫濱' }[jp[1]] || jp[1]}・${jp[2]}區`;
  const toks = addr.replace(/日本|〒?\d{3}-\d{4}/g, '').split(',').map(t => t.trim().replace(/\s+\d{3}-?\d{4}.*$/, '').replace(/-ku$/i, ' Ward').replace(/-city$/i, ''));
  const strip = t => t.replace(/\s+(City|Ward)$/, '').replace(/ō/g, 'o').replace(/ū/g, 'u');
  let city = '', ward = '';
  for (const t of toks) { const k = strip(t); if (JP_CITIES[k] && !/Ward$/.test(t)) { city = city || JP_CITIES[k]; } }
  for (const t of toks) {
    const k = strip(t);
    if (city === '東京' && TOKYO_WARDS[k] && (/City$/.test(t) || t === k)) { ward = TOKYO_WARDS[k]; break; }
    if (city === '橫濱' && /Ward$/.test(t) && YOKOHAMA_WARDS[k]) { ward = YOKOHAMA_WARDS[k]; break; }
    if (CITY_WARDS[city] && /Ward$/.test(t) && CITY_WARDS[city][k]) { ward = CITY_WARDS[city][k]; break; }
    if (!ward && /Ward$/.test(t)) ward = k + ' 區';
  }
  if (!city) { const c = toks.find(t => /City$/.test(t)); if (c) city = JP_CITIES[strip(c)] || strip(c); }
  if (!city) { const i = toks.findIndex(t => JP_PREFS.test(strip(t))); if (i > 0 && !/\d/.test(toks[i - 1])) city = JP_CITIES[strip(toks[i - 1])] || strip(toks[i - 1]); }
  return [city, ward].filter(Boolean).join('・');
}

function filtered() {
  const q = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let out = S.places.map(eff).filter(p => {
    if (S.list && !p.lists.includes(S.list)) return false;
    if (S.list && S.area && areaKey(p) !== S.area) return false;
    if (S.cats.size && !S.cats.has(p.cat)) return false;
    const hay = `${p.name} ${p.note} ${p.address} ${p.area} ${p.category || ''} ${p.cat ? CATS[p.cat].label : ''} ${p.visits.map(v => v.date + ' ' + v.memo).join(' ')}`.toLowerCase();
    return q.every(w => hay.includes(w));
  });
  if (S.sort === 'near' && S.me) { out.forEach(p => p._d = distKm(S.me, p)); out.sort((a, b) => a._d - b._d); }
  else if (S.sort === 'liked') out.sort((a, b) => (b.liked - a.liked) || ((b.visits[0]?.date || '').localeCompare(a.visits[0]?.date || '')) || a.name.localeCompare(b.name));
  return out;
}

/* ========= 畫面 ========= */
const heartSVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${HEART_PATH}"/></svg>`;
const heartBtn = p => `<button class="heart" data-like="${esc(p.id)}" aria-pressed="${p.liked}" aria-label="${p.liked ? '取消最愛' : '加入最愛'}">${heartSVG}</button>`;
const badge = p => p.cat ? `<span class="badge" style="--c:${CATS[p.cat].color}">${esc(CATS[p.cat].label)}</span>` : `<span class="badge none">未分類</span>`;
const photosHTML = p => `<div class="photos">${[0, 1].map(i => p.photos[i]
  ? `<img src="${esc(p.photos[i])}" alt="${esc(p.name)} 照片 ${i + 1}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'🥗'}))">`
  : `<div class="ph">${i ? '🍜' : '🥗'}</div>`).join('')}</div>`;

function renderChips() {
  // 數量只算目前選的城市清單（選「全部清單」時算全部）
  const all = S.places.map(eff).filter(p => (!S.list || p.lists.includes(S.list)) && (!S.area || areaKey(p) === S.area));
  $('chips').innerHTML = Object.entries(CATS).map(([k, c]) =>
    `<button class="chip" data-cat="${k}" style="--c:${c.color}" aria-pressed="${S.cats.has(k)}"><i></i>${esc(c.label)}<span class="n">${all.filter(p => p.cat === k).length}</span></button>`).join('');
}
function renderCities() {
  const n = l => S.places.filter(p => p.lists.includes(l)).length;
  $('cities').innerHTML = `<button class="city" data-list="" aria-pressed="${!S.list}">全部<span class="n">${S.places.length}</span></button>` +
    LISTS.map(l => `<button class="city" data-list="${esc(l)}" aria-pressed="${S.list === l}">${esc(cityName(l))}<span class="n">${n(l)}</span></button>`).join('');
  const box = $('areas');
  if (!S.list) { box.classList.add('hidden'); return; }
  const counts = {};
  S.places.filter(p => p.lists.includes(S.list)).forEach(p => { const k = areaKey(p); counts[k] = (counts[k] || 0) + 1; });
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'zh-TW'));
  if (keys.length < 2) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = `<span class="lbl">區域</span><button class="area" data-area="" aria-pressed="${!S.area}">全部</button>` +
    keys.map(k => `<button class="area" data-area="${esc(k)}" aria-pressed="${S.area === k}">${esc(k)}<span class="n">${counts[k]}</span></button>`).join('');
}
function miniCardHTML(p) {
  const st = openStatus(p);
  const last = p.visits[0];

/* ========= 地圖 ========= */
let map, layer, meMarker = null, fitted = false;
const markers = new Map();
function ensureMap() {
  if (map) return;
  map = L.map('map').setView([35.68, 139.76], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  layer = (L.markerClusterGroup ? L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 48, spiderfyOnMaxZoom: true,
    iconCreateFunction: cl => {
      const kids = cl.getAllChildMarkers(), n = kids.length, cnt = {};
      kids.forEach(m => cnt[m.options.cat] = (cnt[m.options.cat] || 0) + 1);
      let acc = 0;
      const stops = [...Object.keys(CATS), 'none'].filter(k => cnt[k]).map(k => {
        const from = acc; acc += cnt[k] / n * 100;
        return `${k === 'none' ? 'var(--c-none)' : CATS[k].color} ${from}% ${acc}%`;
      }).join(',');
      const size = n < 10 ? 38 : n < 30 ? 46 : 54;
      return L.divIcon({ className: 'cluwrap', html: `<div class="clu" style="background:conic-gradient(${stops})"><span>${n}</span></div>`, iconSize: [size, size] });
    },
  }) : L.featureGroup()).addTo(map);
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.innerHTML = Object.values(CATS).map(c => `<div><i style="--c:${c.color}"></i>${c.label}</div>`).join('') + `<div><i style="--c:var(--c-none)"></i>未分類</div>`; return d; };
  legend.addTo(map);
}
function renderMap(list) {
  ensureMap();
  layer.clearLayers(); markers.clear();
  list.forEach(p => {
    const color = p.cat ? CATS[p.cat].color : 'var(--c-none)';
    const icon = L.divIcon({ className: 'dotwrap', html: `<span class="dot${p.liked ? ' liked' : ''}" style="--c:${color}"></span>`, iconSize: [26, 26], iconAnchor: [13, 13] });
    const m = L.marker([p.lat, p.lng], { icon, riseOnHover: true, keyboard: true, title: p.name, cat: p.cat || 'none' })
      .bindTooltip(`${esc(p.name)}${p.note ? `<br><small>${esc(p.note.slice(0, 30))}</small>` : ''}`, { direction: 'top', offset: [0, -14] })
      .on('click', () => openDetail(p.id));
    m.addTo(layer); markers.set(p.id, m);
  });
  if (meMarker) { meMarker.remove(); meMarker = null; }
  if (S.me && S.sort === 'near') meMarker = L.circleMarker([S.me.lat, S.me.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#d81b60', fillOpacity: 1 }).bindTooltip('我的位置').addTo(map);
  if (!fitted && list.length) { map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 15 }); fitted = true; }
}
function setView(v) {
  S.view = v;
  $('tabList').setAttribute('aria-selected', v === 'list');
  $('tabMap').setAttribute('aria-selected', v === 'map');
  $('list').classList.toggle('hidden', v !== 'list');
  $('map').classList.toggle('hidden', v !== 'map');
  setHeaderMini(v === 'map' || $('list').scrollTop > 60);
  if (v === 'map') { ensureMap(); setTimeout(() => { map.invalidateSize(); renderMap(filtered()); }, 0); setTimeout(() => map.invalidateSize(), 350); }
  ls.set(LS_VIEW, v);
}
function showOnMap(id) {
  closeDlg($('detail'));
  setView('map');
  setTimeout(() => {
    const m = markers.get(id); if (!m) return;
    const flash = () => { const dot = m.getElement()?.querySelector('.dot'); if (dot) { dot.classList.add('flash'); setTimeout(() => dot.classList.remove('flash'), 1800); } };
    if (layer.zoomToShowLayer) layer.zoomToShowLayer(m, () => { map.setView(m.getLatLng(), Math.max(map.getZoom(), 16)); setTimeout(flash, 300); });
    else { map.setView(m.getLatLng(), 16); flash(); }
  }, 80);
}

/* ========= 愛心動畫 ========= */
function burst(btn) {
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#e8435a', '#ff7a90', '#ffb3c0', '#ff4d6d', '#f9a8d4'];
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .3, r = 26 + Math.random() * 14;
    const s = document.createElement('span');
    s.className = 'particle';
    s.style.cssText = `--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px;--rot:${(Math.random() * 60 - 30) | 0}deg;--pc:${colors[i % colors.length]};width:${7 + Math.random() * 5}px;height:${7 + Math.random() * 5}px`;
    s.innerHTML = `<svg viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>`;
    btn.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}
function toggleLike(id, btn) {
  const liked = !(my.places[id]?.liked);
  saveMy(id, { liked });
  document.querySelectorAll(`.heart[data-like="${CSS.escape(id)}"]`).forEach(b => { b.setAttribute('aria-pressed', liked); b.setAttribute('aria-label', liked ? '取消最愛' : '加入最愛'); });
  if (liked) burst(btn);
  if (S.view === 'map') renderMap(filtered());
}

$('denseBtn').onclick = () => { S.dense = !S.dense; ls.set('veggie-dense', S.dense ? '1' : '0'); render(); };
// 往下捲時把頂部收小，讓畫面留給店家
function setHeaderMini(on) {
  const h = document.querySelector('header');
  if (h.classList.contains('mini') === on) return;
  h.classList.toggle('mini', on);
  if (map && S.view === 'map') setTimeout(() => map.invalidateSize(), 350);
}
$('list').addEventListener('scroll', () => {
  const el = $('list');
  if (S.view !== 'list') return;
  if (el.scrollTop > 60 && el.scrollHeight - el.clientHeight > 220) setHeaderMini(true);
  else if (el.scrollTop < 8) setHeaderMini(false);
}, { passive: true });
$('tabList').onclick = () => setView('list');
$('tabMap').onclick = () => setView('map');
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  S.cats.has(c.dataset.cat) ? S.cats.delete(c.dataset.cat) : S.cats.add(c.dataset.cat);
  fitted = false; render();
});
$('list').addEventListener('click', e => {
  const h = e.target.closest('.heart'); if (h) { e.stopPropagation(); return toggleLike(h.dataset.like, h); }
  const ed = e.target.closest('[data-edit]'); if (ed) { openDetail(ed.dataset.edit); editing = true; drawDetail(); return; }
  const vi = e.target.closest('[data-visit]'); if (vi) { openDetail(vi.dataset.visit); setTimeout(() => { const m = $('vMemo'); m.scrollIntoView({ block: 'center' }); }, 50); return; }
  if (e.target.closest('a')) return; // 點備註裡的連結：直接開新視窗，不打開店家卡片
  const c = e.target.closest('[data-open]'); if (c) openDetail(c.dataset.open);
});
$('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.open) openDetail(e.target.dataset.open); });
function locate() {
  if (!navigator.geolocation) { alert('這個瀏覽器不支援定位'); return setSort('name'); }
  toast('定位中…');
  navigator.geolocation.getCurrentPosition(pos => {
    S.me = { lat: pos.coords.latitude, lng: pos.coords.longitude }; render();
  }, () => { alert('無法取得位置，請允許定位權限'); setSort('name'); }, { enableHighAccuracy: true, timeout: 10000 });
}
function setSort(v) {
  S.sort = v; $('sortSel').value = v; ls.set('veggie-sort', v);
  if (v === 'near' && !S.me) locate();
  render();
}
$('sortSel').addEventListener('change', e => setSort(e.target.value));
document.addEventListener('visibilitychange', async () => { if (!document.hidden && token()) { await loadMy(); render(); } });

/* ========= 啟動 ========= */
(async () => {
  setSync(token() ? 'busy' : 'local');
  const [data] = await Promise.all([fetch('places.json?t=' + Date.now()).then(r => r.json()), loadMy()]);
  S.places = data.places.map(p => ({ ...p, lists: p.lists || [p.list || ''], area: areaOf(p.address) }));
  const fmt = new Date(data.updated).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  $('updated').textContent = `Google 地圖同步：${fmt}・每 3 小時自動檢查`;
  if (data.demo) { $('banner').textContent = '目前顯示的是示範資料。'; $('banner').classList.remove('hidden'); }
  else if (data.errors && data.errors.length) { $('banner').textContent = '有部分清單同步失敗：' + data.errors.join('；'); $('banner').classList.remove('hidden'); }
  const cnt = {};
  S.places.forEach(p => p.lists.forEach(l => { if (l) cnt[l] = (cnt[l] || 0) + 1; }));
  LISTS = Object.keys(cnt).sort((a, b) => (a === '其他收藏') - (b === '其他收藏') || cnt[b] - cnt[a]);
  const savedCity = ls.get('veggie-city');
  if (savedCity && LISTS.includes(savedCity)) S.list = savedCity;
  S.dense = ls.get('veggie-dense') !== '0';
  const savedSort = ls.get('veggie-sort');
  if (savedSort === 'liked') { S.sort = 'liked'; $('sortSel').value = 'liked'; }
  render();
  setView(ls.get(LS_VIEW) || 'list');
})().catch(err => { $('updated').textContent = '讀取資料失敗：' + err.message; });
</script>
</body>
</html>
