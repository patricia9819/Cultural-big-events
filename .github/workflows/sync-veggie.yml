name: 同步 Google 地圖素食清單

on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小時自動同步一次
  workflow_dispatch:          # 可在 GitHub → Actions 手動按「Run workflow」立即同步
  push:
    paths:
      - veggie/lists.json
      - scripts/sync_google_lists.py

permissions:
  contents: write

concurrency:
  group: sync-veggie
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取清單、營業時間與照片
        run: python scripts/sync_google_lists.py
      - name: 有變動才提交
        run: |
          git add -A veggie/
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git config user.name "veggie-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步素食清單 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push && exit 0; sleep 5; done
          exit 1
