<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>1035 Collab Reel</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/900.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette ----------
const INK = '#0B1524', INK2 = '#13233A', GOLD = '#E8B44C', GOLD_L = '#FFE7A3', GOLD_D = '#A8741A',
  BRICK = '#B4442C', BRICK_D = '#7E2A1A', CREAM = '#F4EBDA', WOOD = '#8A5634', SAGE = '#7E9B7A', WHITE = '#FFFFFF';
const SANS = '"Noto Sans TC"', SERIF = '"Noto Serif TC"';

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo3 = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const ei3 = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eexp = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const back = (x, s = 1.70158) => { x = cl(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const elastic = x => { x = cl(x); if (x === 0 || x === 1) return x; return Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1; };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BEAT = 2 / 3; // 90 BPM
const TOTAL = 50;
let RT = 0; // real (output) time; scene functions may receive remapped time
const beatPulse = () => (RT < 5.333 || RT >= 45.333) ? 0 : 0.6 * Math.exp(-((RT % BEAT) / BEAT) * 7);
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = src; }); }
function tintLogo(img, color) { // black-on-light logo -> solid colour with alpha from darkness
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height), [r0, g0, b0] = color;
  for (let i = 0; i < d.data.length; i += 4) {
    const lum = (d.data[i] * 0.299 + d.data[i + 1] * 0.587 + d.data[i + 2] * 0.114) / 255;
    const a = (1 - lum) * (d.data[i + 3] / 255);
    d.data[i] = r0; d.data[i + 1] = g0; d.data[i + 2] = b0; d.data[i + 3] = Math.round(cl(a * 1.15) * 255);
  }
  g.putImageData(d, 0, 0); return c;
}

// ---------- text helpers ----------
function font(size, weight = 900, fam = SANS) { return `${weight} ${size}px ${fam}`; }
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.size || 60, o.weight || 900, o.fam || SANS);
  ctx.fillStyle = o.color || WHITE;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.alpha !== undefined) ctx.globalAlpha *= cl(o.alpha);
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.blur || 30; }
  if (o.stroke) { ctx.lineWidth = o.lw || 3; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o) { ctx.save(); ctx.font = font(o.size || 60, o.weight || 900, o.fam || SANS); ctx.letterSpacing = (o.ls || 0) + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// masked slide-up reveal (and optional exit)
function maskText(s, x, y, p, o = {}, out = 0) {
  const size = o.size || 60, w = measure(s, o) + 40;
  ctx.save();
  ctx.beginPath();
  const ax = o.align === 'left' ? x - 20 : (o.align === 'right' ? x - w + 20 : x - w / 2);
  ctx.rect(ax, y - size * 0.75, w, size * 1.5);
  ctx.clip();
  const e = eo5(cl(p)), eOut = ei3(cl(out));
  txt(s, x, y + (1 - e) * size * 1.3 - eOut * size * 1.3, o);
  ctx.restore();
}
// per-character staggered pop
function charsPop(s, x, y, t, t0, stagger, o = {}, mode = 'rise') {
  const chars = [...s];
  const widths = chars.map(c => measure(c, { ...o, ls: 0 }));
  const ls = o.ls || 0;
  const total = widths.reduce((a, b) => a + b, 0) + ls * (chars.length - 1);
  let cx = o.align === 'left' ? x : x - total / 2;
  chars.forEach((c, i) => {
    const lp = cl((t - t0 - i * stagger) / (o.dur || 0.45));
    if (lp > 0) {
      ctx.save();
      const mx = cx + widths[i] / 2;
      ctx.translate(mx, y);
      if (mode === 'rise') { const e = back(lp, 2.2); ctx.translate(0, (1 - e) * (o.size || 60) * 0.8); ctx.globalAlpha *= cl(lp * 2.5); }
      if (mode === 'scale') { const e = back(lp, 3); ctx.scale(e, e); ctx.globalAlpha *= cl(lp * 3); }
      if (mode === 'flip') { const e = eo5(lp); ctx.scale(1, Math.max(0.001, e)); ctx.rotate((1 - e) * 0.4); ctx.globalAlpha *= cl(lp * 3); }
      txt(c, 0, 0, { ...o, align: 'center', ls: 0 });
      ctx.restore();
    }
    cx += widths[i] + ls;
  });
  return total;
}
function goldGrad(x0, y0, x1, y1, shimmer = -1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#FFF1C1'); g.addColorStop(0.35, GOLD); g.addColorStop(0.62, GOLD_D); g.addColorStop(1, '#F7D57E');
  if (shimmer >= 0 && shimmer <= 1) {
    const s = cl(shimmer, 0.02, 0.98);
    g.addColorStop(Math.max(0, s - 0.02), '#F5D27A'); g.addColorStop(s, '#FFFFFF'); g.addColorStop(Math.min(1, s + 0.02), '#F0C565');
  }
  return g;
}

// ---------- fx ----------
const grain = [];
(function () { for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = 360; c.height = 640; const g = c.getContext('2d'); const id = g.createImageData(360, 640); const r = rng(77 + k); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); grain.push(c); } })();

function confetti(t, t0, seed, n, ox, oy, o = {}) {
  const tt = t - t0; if (tt < 0) return;
  const r = rng(seed);
  const cols = o.colors || [GOLD, GOLD_L, BRICK, CREAM, '#F0C565', WHITE];
  const k = 1.6, g = o.g || 900;
  for (let i = 0; i < n; i++) {
    const a = (o.dir ?? -Math.PI / 2) + (r() - .5) * (o.spread ?? Math.PI * 1.6);
    const sp = (o.speed || 2200) * (0.35 + r() * 0.75);
    const vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
    const x = ox + vx * (1 - Math.exp(-k * tt)) / k + Math.sin(tt * (2 + r() * 3) + i) * 30 * tt;
    const y = oy + vy * (1 - Math.exp(-k * tt)) / k + (g / k) * (tt - (1 - Math.exp(-k * tt)) / k);
    const life = (o.life || 3.2) * (0.7 + r() * 0.5);
    const al = cl(1 - (tt - life * 0.7) / (life * 0.3));
    if (al <= 0) continue;
    const sz = (o.size || 22) * (0.6 + r() * 0.8);
    const spin = 4 + r() * 10, ph = r() * 6;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ph + tt * spin * 0.6);
    ctx.scale(1, Math.cos(ph + tt * spin));
    ctx.globalAlpha *= al;
    ctx.fillStyle = cols[i % cols.length];
    if (i % 3 === 0) { ctx.beginPath(); ctx.arc(0, 0, sz * 0.4, 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(-sz / 2, -sz * 0.22, sz, sz * 0.44);
    ctx.restore();
  }
}
function firework(t, t0, seed, x0, y0, o = {}) {
  const tt = t - t0; if (tt < 0 || tt > 2.2) return;
  const r = rng(seed), n = o.n || 70, col = o.color || GOLD_L;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + r() * 0.1, sp = (o.speed || 650) * (0.75 + r() * 0.35);
    const pos = s => { const d = sp * (1 - Math.exp(-2.6 * s)) / 2.6; return [x0 + Math.cos(a) * d, y0 + Math.sin(a) * d + 120 * s * s]; };
    const [x, y] = pos(tt), [px, py] = pos(Math.max(0, tt - 0.12));
    const al = cl(1 - tt / 2.0) * (0.6 + 0.4 * Math.sin(tt * 30 + i));
    ctx.strokeStyle = col; ctx.globalAlpha = al; ctx.lineWidth = 4 * (1 - tt / 2.4);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
  }
  // core flash
  const f = cl(1 - tt / 0.35);
  if (f > 0) { const g = ctx.createRadialGradient(x0, y0, 0, x0, y0, 220); g.addColorStop(0, `rgba(255,240,200,${f})`); g.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = g; ctx.globalAlpha = 1; ctx.fillRect(x0 - 220, y0 - 220, 440, 440); }
  ctx.restore();
}
function sparkles(t, seed, n, area, col = GOLD_L) {
  const r = rng(seed);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x = area[0] + r() * area[2], y = area[1] + r() * area[3] - ((t * (20 + r() * 40)) % area[3]);
    const yy = y < area[1] ? y + area[3] : y;
    const tw = 0.5 + 0.5 * Math.sin(t * (3 + r() * 5) + i);
    const s = (2 + r() * 5) * tw;
    ctx.globalAlpha = tw * 0.8; ctx.fillStyle = col;
    star(x, yy, s * 3, s * 0.6); ctx.fill();
  }
  ctx.restore();
}
function star(x, y, R, r) { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r : R; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function rings(t, t0, x, y, col, n = 3, maxR = 900, lw = 6) {
  ctx.save();
  for (let i = 0; i < n; i++) {
    const p = pr(t, t0 + i * 0.08, t0 + i * 0.08 + 1.0); if (p <= 0 || p >= 1) continue;
    ctx.strokeStyle = col; ctx.globalAlpha = (1 - p) * 0.9; ctx.lineWidth = lw * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(x, y, eo3(p) * maxR, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function rays(t, x, y, n, col, alpha, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { ctx.rotate(Math.PI * 2 / n); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -1400); ctx.lineTo(40, -1400); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function blueprintGrid(t, col, alpha, p) {
  ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = alpha; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { const pp = eo3(cl(p * 2 - x / W)); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * pp); ctx.stroke(); }
  for (let y = 0; y <= H; y += 60) { const pp = eo3(cl(p * 2 - y / H)); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W * pp, y); ctx.stroke(); }
  ctx.restore();
}
function segs(list, p, col, lw, stagger = 0.6) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = list.length;
  list.forEach((s, i) => {
    const lp = eio(cl((p - (i / n) * stagger) / (1 - stagger)));
    if (lp <= 0) return;
    ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(lerp(s[0], s[2], lp), lerp(s[1], s[3], lp)); ctx.stroke();
  });
  ctx.restore();
}
function rectSegs(x, y, w, h) { return [[x, y, x + w, y], [x + w, y, x + w, y + h], [x + w, y + h, x, y + h], [x, y + h, x, y]]; }
function bg(c1, c2) { const g = ctx.createRadialGradient(CX, CY * 0.9, 100, CX, CY, 1300); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function cam(t, z0, z1, a, b, punch = 0) {
  const z = lerp(z0, z1, eio(pr(t, a, b))) * (1 + punch);
  ctx.translate(CX, CY); ctx.scale(z, z); ctx.translate(-CX, -CY);
}
function pill(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- building geometry ----------
const GY = 1240;
const facade = [
  [180, 880, 900, 880],               // tie beam
  [180, 880, 540, 660], [900, 880, 540, 660],   // rafters
  [540, 660, 540, 880],               // king post
  [540, 880, 360, 770], [540, 880, 720, 770],   // struts
  [450, 715, 450, 880], [630, 715, 630, 880],   // queen posts
  ...rectSegs(230, 880, 620, GY - 880),
  ...rectSegs(285, 960, 130, 170), [350, 960, 350, 1130], [285, 1045, 415, 1045],
  ...rectSegs(665, 960, 130, 170), [730, 960, 730, 1130], [665, 1045, 795, 1045],
  ...rectSegs(475, 1000, 130, 240), [540, 1000, 540, 1240],
  [80, GY, 1000, GY],
];

// ---------- scenes ----------
function S1(t) { // 0-4 intro
  bg(INK2, INK);
  blueprintGrid(t, '#3B5C86', 0.25, pr(t, 0, 1.6));
  ctx.save();
  cam(t, 1.08, 1.0, 0, 4, 0);
  // building line art
  const bp = pr(t, 0.2, 3.0);
  ctx.save(); ctx.translate(0, 60);
  ctx.shadowColor = 'rgba(232,180,76,0.6)'; ctx.shadowBlur = 18;
  segs(facade, bp, GOLD, 5, 0.7);
  ctx.restore();
  // dimension marks
  const dp = eo3(pr(t, 1.6, 2.6));
  ctx.save(); ctx.strokeStyle = '#6E8FB8'; ctx.lineWidth = 2; ctx.globalAlpha = dp;
  ctx.beginPath(); ctx.moveTo(230, 1360); ctx.lineTo(230 + 620 * dp, 1360); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(230, 1345); ctx.lineTo(230, 1375); ctx.moveTo(850, 1345); ctx.lineTo(850, 1375); ctx.stroke();
  txt('市府路 73', 540, 1395, { size: 26, weight: 400, color: '#8FB0D8', ls: 8, alpha: dp });
  ctx.restore();
  ctx.restore();
  // title
  const yr = Math.floor(lerp(1910, 2026, eo5(pr(t, 0.3, 1.6))));
  txt(String(yr), CX, 330, { size: 120, weight: 900, color: GOLD, ls: 18, alpha: pr(t, 0.3, 0.6) });
  maskText('第八屆', CX, 480, pr(t, 1.2, 1.8), { size: 64, weight: 700, color: CREAM, ls: 20 });
  maskText('ADA 新銳建築獎', CX, 575, pr(t, 1.45, 2.1), { size: 92, weight: 900, color: WHITE, ls: 8 });
  // converge flash before drop
  const f = pr(t, 3.5, 4.0);
  if (f > 0) { ctx.save(); ctx.globalAlpha = ei3(f); ctx.fillStyle = GOLD_L; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

function S2(t) { // 4-8 首獎 drop
  const lt = t - 4;
  bg('#2A1C08', INK);
  const bpz = beatPulse(t);
  rays(t, CX, 900, 18, GOLD, 0.09 + 0.05 * bpz, t * 0.15);
  rings(t, 4, CX, 900, GOLD_L, 4, 1100, 10);
  rings(t, 6, CX, 900, GOLD, 2, 900, 5);
  ctx.save();
  cam(t, 1.0, 1.06, 4, 8, bpz * 0.012);
  // laurel arcs
  laurel(CX, 900, 400, eo3(pr(lt, 0.2, 1.2)), t);
  // 首獎
  const s = elastic(pr(lt, 0.0, 1.1));
  ctx.save(); ctx.translate(CX, 900); ctx.scale(s, s);
  ctx.font = font(330, 900, SERIF); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '10px';
  ctx.shadowColor = 'rgba(255,200,90,0.55)'; ctx.shadowBlur = 60;
  ctx.fillStyle = goldGrad(-330, -170, 330, 170, pr(lt, 1.2, 2.2));
  ctx.fillText('首獎', 0, 0);
  ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,245,210,0.6)'; ctx.strokeText('首獎', 0, 0);
  ctx.restore();
  maskText('榮 獲', CX, 590, pr(lt, 0.4, 0.9), { size: 62, weight: 700, color: CREAM, ls: 30 });
  // badge line
  const lp = eo5(pr(lt, 0.8, 1.6));
  ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.globalAlpha = lp;
  ctx.beginPath(); ctx.moveTo(CX - 330 * lp, 1150); ctx.lineTo(CX + 330 * lp, 1150); ctx.stroke(); ctx.restore();
  maskText('FIRST PRIZE', CX, 1215, pr(lt, 1.0, 1.6), { size: 50, weight: 700, color: GOLD_L, ls: 26 });
  maskText('2026 第八屆 ADA 新銳建築獎', CX, 1300, pr(lt, 1.3, 1.9), { size: 40, weight: 400, color: CREAM, ls: 6 });
  ctx.restore();
  sparkles(t, 9, 40, [0, 300, W, 1300]);
  confetti(t, 4.0, 11, 160, CX, 1000, { speed: 2600 });
  confetti(t, 4.0, 12, 70, 0, 1500, { dir: -Math.PI / 3, spread: 0.8, speed: 2500 });
  confetti(t, 4.0, 13, 70, W, 1500, { dir: -Math.PI * 2 / 3, spread: 0.8, speed: 2500 });
  const f = 1 - pr(t, 4.0, 4.35);
  if (f > 0) { ctx.save(); ctx.globalAlpha = f; ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
function laurel(x, y, R, p, t) {
  ctx.save(); ctx.translate(x, y);
  for (const side of [-1, 1]) {
    const n = 9;
    for (let i = 0; i < n; i++) {
      const lp = cl(p * (n + 3) - i) / 1; if (lp <= 0) continue;
      const a = Math.PI / 2 + side * (0.35 + i * 0.27);
      const lx = Math.cos(a) * R, ly = Math.sin(a) * R * 0.95;
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(a + side * 0.9 + Math.PI / 2 * (side > 0 ? 1 : -1) * 0);
      ctx.rotate(side > 0 ? -0.5 : 0.5 + Math.PI);
      const s = back(cl(lp), 2.5);
      ctx.scale(s, s);
      ctx.fillStyle = goldGrad(-40, -15, 40, 15);
      ctx.beginPath(); ctx.ellipse(0, 0, 44, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function S3(t) { // 8-12 1035 dial
  const lt = t - 8;
  bg('#1A2B45', INK);
  const bpz = beatPulse(t);
  ctx.save(); cam(t, 1.0, 1.04, 8, 12, bpz * 0.01);
  // digits typed in on each beat-second
  const digits = ['1', '0', '3', '5'];
  const dx = [-255, -85, 85, 255];
  digits.forEach((d, i) => {
    const td = 8 + i * 0.75 + 0.45;
    const p = pr(t, td, td + 0.35);
    if (p <= 0) { // placeholder slot
      ctx.save(); ctx.strokeStyle = 'rgba(232,180,76,0.35)'; ctx.lineWidth = 4; ctx.setLineDash([14, 12]);
      pill(CX + dx[i] - 70, 330, 140, 190, 20); ctx.stroke(); ctx.restore();
      return;
    }
    const s = back(p, 3);
    ctx.save(); ctx.translate(CX + dx[i], 430); ctx.scale(s, s);
    ctx.font = font(230, 900, SANS); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = goldGrad(-80, -110, 80, 110, pr(lt, 3.2, 3.9));
    ctx.shadowColor = 'rgba(232,180,76,0.5)'; ctx.shadowBlur = 40;
    ctx.fillText(d, 0, 0); ctx.restore();
    rings(t, td, CX + dx[i], 430, GOLD_L, 1, 160, 4);
  });
  maskText('Collab', CX, 640, pr(t, 11.0, 11.5), { size: 110, weight: 400, fam: SERIF, color: CREAM, ls: 22 });
  // rotary dial
  const dialY = 1130, R = 300;
  const dp = back(pr(lt, 0, 0.6), 1.6);
  ctx.save(); ctx.translate(CX, dialY); ctx.scale(dp, dp);
  // body
  ctx.fillStyle = BRICK; ctx.beginPath(); ctx.arc(0, 0, R + 30, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, R + 30, 0, Math.PI * 2); ctx.stroke();
  // number ring (static)
  const order = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
  const holeA = k => -Math.PI / 3 - k * (Math.PI * 1.45 / 9); // counter-clockwise from upper-right

function handSprite(img, H0, color) {
  const w0 = Math.round(H0 * img.width / img.height);
  const c = document.createElement('canvas'); c.width = w0; c.height = H0;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, w0, H0);
  const d = g.getImageData(0, 0, w0, H0).data;
  let x0 = w0, y0 = H0, x1 = 0, y1 = 0;
  for (let y = 0; y < H0; y++) for (let x = 0; x < w0; x++) if (d[(y * w0 + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  const og = o.getContext('2d'); og.drawImage(c, -x0, -y0);
  og.globalCompositeOperation = 'source-in'; og.fillStyle = color; og.fillRect(0, 0, o.width, o.height);
  return o;
}

  ctx.fillStyle = `rgb(${r1.map((v, i) => Math.round(lerp(v, r2[i], flip))).join(',')})`;
  pill(BX, BY, BW, BH, 28); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.globalAlpha = bp * (0.35 + 0.65 * flip); pill(BX + 18, BY + 18, BW - 36, BH - 36, 18); ctx.stroke();
  ctx.restore();
  // hands
  const HH = 330, gap = 44;
  const ws = [0, 1, 2, 3].map(i => IMG['hInk' + i] ? HH * IMG['hInk' + i].width / IMG['hInk' + i].height : 160);
  const tot = ws.reduce((a, b) => a + b, 0) + gap * 3;
  let x = CX - tot / 2;
  const digits = ['1', '0', '3', '5'];
  ws.forEach((w, i) => {
    const p = pr(t, SIGN_T[i] - 0.08, SIGN_T[i] + 0.42);
    const hx = x + w / 2, hy = BY + BH / 2;
    if (p > 0 && IMG['hInk' + i]) {
      const e = back(p, 2.4);
      ctx.save(); ctx.translate(hx, hy + HH / 2); ctx.scale(e, e); ctx.rotate((1 - eo3(p)) * (i % 2 ? 0.25 : -0.25));
      // wipe up from the cuff
      ctx.beginPath(); ctx.rect(-w, -HH * eo3(cl(p * 1.4)) - 10, w * 2, HH + 20); ctx.clip();
      ctx.globalAlpha = 1 - flip; ctx.drawImage(IMG['hInk' + i], -w / 2, -HH, w, HH);
      if (flip > 0) {
        ctx.globalAlpha = flip; ctx.shadowColor = 'rgba(255,196,90,0.8)'; ctx.shadowBlur = 30 * flip;
        ctx.drawImage(IMG['hGold' + i], -w / 2, -HH, w, HH);
      }
      ctx.restore();
      rings(t, SIGN_T[i] - 0.08, hx, hy, i % 2 ? GOLD : BRICK, 2, 230, 6);
      // digit badge below the board
      const q = back(pr(t, SIGN_T[i] + 0.05, SIGN_T[i] + 0.45), 2.8);
      if (q > 0) {
        ctx.save(); ctx.translate(hx, BY + BH + 110); ctx.scale(q, q);
        ctx.strokeStyle = GOLD_L; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -58); ctx.lineTo(0, -100); ctx.stroke();
        ctx.fillStyle = goldGrad(-55, -55, 55, 55, pr(t, 19.6, 20.6)); ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.fill();
        txt(digits[i], 0, 4, { size: 76, weight: 900, color: INK });
        ctx.restore();
      }
    }
    x += w + gap;
  });
  ctx.restore();
  sparkles(t, 61, 26, [0, 200, W, 1500]);
  maskText('店家招牌', CX, 300, pr(t, 16.2, 16.7), { size: 56, weight: 700, color: GOLD_L, ls: 24 });
  maskText('用手勢比出 1035', CX, 410, pr(t, 16.35, 16.85), { size: 94, weight: 900, color: WHITE, ls: 6 });
  maskText('延續老診所的', CX, 1560, pr(t, 19.4, 19.8), { size: 60, weight: 700, color: CREAM, ls: 8 });
  maskText('原有電話號碼', CX, 1650, pr(t, 19.55, 19.95), { size: 60, weight: 900, color: GOLD_L, ls: 8 });
}

// ---------- timeline & transitions ----------
// s/e = output time; os/k = original scene time base + speed (choreography kept, played more spaciously)
const scenes = [
  { s: 0, e: 5.333, f: S1, os: 0, k: 0.75, tr: null },
  { s: 5.333, e: 10.667, f: S2, os: 4, k: 0.75, tr: 'cut' },
  { s: 10.667, e: 16, f: S3, os: 8, k: 0.75, tr: 'bars' },
  { s: 16, e: 21.333, f: SIGN, os: 16, k: 1, tr: 'push' },
  { s: 21.333, e: 26.667, f: S4, os: 12, k: 0.75, tr: 'iris' },
  { s: 26.667, e: 30.667, f: S5a, os: 16, k: 0.5, tr: 'diag' },
  { s: 30.667, e: 34.667, f: S5b, os: 18, k: 0.5, tr: 'push' },
  { s: 34.667, e: 40, f: S6, os: 20, k: 0.75, tr: 'bars2' },
  { s: 40, e: 45.333, f: S7, os: 24, k: 0.75, tr: 'cut' },
  { s: 45.333, e: 50.1, f: S8, os: 28, k: 0.8, tr: 'iris2' },
];
const TD = 0.45; // transition length, ends at the cut

function drawScene(i, t) { const sc = scenes[i]; ctx.save(); sc.f(sc.os + (t - sc.s) * sc.k); ctx.restore(); }

function render(t) {
  RT = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  let i = scenes.findIndex(s => t >= s.s && t < s.e); if (i < 0) i = scenes.length - 1;
  // incoming transition into scene i+1?
  const nx = scenes[i + 1];
  if (nx && nx.tr !== 'cut' && t >= nx.s - TD) {
    const p = eio(pr(t, nx.s - TD, nx.s));
    drawScene(i, t);
    ctx.save();
    transitionClip(nx.tr, p, t);
    drawScene(i + 1, t);
    ctx.restore();
    transitionDecor(nx.tr, p);
  } else drawScene(i, t);
  overlay(t);
}
function transitionClip(type, p, t) {
  ctx.beginPath();
  if (type === 'bars' || type === 'bars2') {
    const n = 6, bw = W / n;
    for (let k = 0; k < n; k++) { const q = eio(cl(p * 1.6 - k * 0.12)); if (type === 'bars') ctx.rect(k * bw, H * (1 - q), bw + 1, H * q); else ctx.rect(k * bw, 0, bw + 1, H * q); }
  } else if (type === 'iris') { ctx.arc(CX + 30, 640, p * 2300, 0, Math.PI * 2); }
  else if (type === 'iris2') { ctx.arc(CX, 640, p * 2300, 0, Math.PI * 2); }
  else if (type === 'diag') { const o = lerp(-1.3, 1.1, p) * (W + H); ctx.moveTo(o, 0); ctx.lineTo(o + 800, 0); ctx.lineTo(o + 800 - H * 0.6, H); ctx.lineTo(o - H * 0.6 - 3000, H); ctx.lineTo(o - 3000, 0); }
  else if (type === 'push') { ctx.rect(W * (1 - p), 0, W * p + 1, H); }
  ctx.clip();
  if (type === 'push') ctx.translate(W * (1 - p) * 0.35, 0);
}
function transitionDecor(type, p) {
  ctx.save();
  if (type === 'bars' || type === 'bars2') {
    const n = 6, bw = W / n; ctx.fillStyle = GOLD;
    for (let k = 0; k < n; k++) { const q = eio(cl(p * 1.6 - k * 0.12)); if (q <= 0 || q >= 1) continue; const y = type === 'bars' ? H * (1 - q) : H * q; ctx.fillRect(k * bw, y - 14, bw + 1, 28); }
  } else if (type === 'iris' || type === 'iris2') {
    if (p > 0 && p < 1) { ctx.strokeStyle = type === 'iris' ? GOLD : BRICK; ctx.lineWidth = 40 * (1 - p) + 4; ctx.beginPath(); ctx.arc(type === 'iris' ? CX + 30 : CX, 640, p * 2300, 0, Math.PI * 2); ctx.stroke(); }
  } else if (type === 'diag') {
    if (p > 0 && p < 1) { const o = lerp(-1.3, 1.1, p) * (W + H); ctx.fillStyle = BRICK; ctx.beginPath(); ctx.moveTo(o + 800, 0); ctx.lineTo(o + 860, 0); ctx.lineTo(o + 860 - H * 0.6, H); ctx.lineTo(o + 800 - H * 0.6, H); ctx.fill(); }
  } else if (type === 'push') {
    if (p > 0 && p < 1) { ctx.fillStyle = GOLD; ctx.fillRect(W * (1 - p) - 12, 0, 24, H); }
  }
  ctx.restore();
}
function overlay(t) {
  ctx.save();
  // vignette
  const v = ctx.createRadialGradient(CX, CY, 500, CX, CY, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.globalAlpha = 0.05; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain[Math.floor(t * 30) % grain.length], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // showreel HUD
  const light = t >= 26.667 && t < 30.667 || t >= 45.333;
  const hc = light ? 'rgba(60,40,20,0.55)' : 'rgba(255,240,210,0.55)';
  const hp = eo3(pr(t, 0.2, 0.8));
  ctx.strokeStyle = hc; ctx.lineWidth = 3; ctx.globalAlpha = hp;
  const m = 56, L = 54;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); });
  const fr = Math.floor(t * 30);
  const tc = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(fr % 30).padStart(2, '0')}`;
  txt('1035 COLLAB · FIRST PRIZE', m + 20, m + 34, { size: 22, weight: 700, color: hc, align: 'left', ls: 4 });
  txt(tc, W - m - 20, m + 34, { size: 22, weight: 700, color: hc, align: 'right', ls: 4 });
  // progress line
  ctx.fillStyle = light ? BRICK : GOLD; ctx.globalAlpha = hp * 0.9;
  ctx.fillRect(m + 20, H - m - 22, (W - 2 * m - 40) * cl(t / TOTAL), 4);
  ctx.globalAlpha = hp * 0.25; ctx.fillRect(m + 20, H - m - 22, (W - 2 * m - 40), 4);
  ctx.restore();
}

// ---------- font readiness ----------
const ALLTEXT = '0123456789—TELADA 新銳建築獎第八屆首獎榮獲FIRSTPRZEColab作品名稱源自修復時於櫃中發現的老診所電話號碼臺中市區府路73號原為吳眼科百年屋再生咖啡烘焙展覽工作室保留前棟木架與紅磚牆以庭院廊道串聯兩後新舊交織光影流動受補助單位歷史活化計畫★同時是恭喜設團隊李預萍高思豪賀·COLLAB:店家招牌用手勢比出延續的原有電話號碼敬';
window.ready = (async () => {
  const specs = [['400', SANS], ['700', SANS], ['900', SANS], ['700', SERIF], ['900', SERIF], ['400', SERIF]];
  await Promise.all(specs.map(([w, f]) => document.fonts.load(`${w} 40px ${f}`, ALLTEXT).catch(() => {})));
  await document.fonts.ready;
  await Promise.all([loadImg('logo', 'logo.png'), ...[1, 2, 3, 4].map(i => loadImg('h' + (i - 1), 'hands/h' + i + '.svg'))]);
  for (let i = 0; i < 4; i++) if (IMG['h' + i]) { IMG['hInk' + i] = handSprite(IMG['h' + i], 900, '#14191F'); IMG['hGold' + i] = handSprite(IMG['h' + i], 900, '#F2C25E'); }
  if (IMG.logo) IMG.logoInk = tintLogo(IMG.logo, [20, 28, 40]);
  render(0);
  return [...document.fonts].filter(f => f.status === 'loaded').length;
})();
window.render = render;
// preview mode: play in real time when opened with #play
if (location.hash === '#play') window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); })(); });
</script>
