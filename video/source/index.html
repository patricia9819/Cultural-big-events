<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>臺中州廳導覽</title>
<style>
@font-face{font-family:'NS';src:url(NotoSerifTC-400.ttf);font-weight:400}
@font-face{font-family:'NS';src:url(NotoSerifTC-700.ttf);font-weight:700}
@font-face{font-family:'NS';src:url(NotoSerifTC-900.ttf);font-weight:900}
@font-face{font-family:'CZ';src:url(Cinzel-400.ttf);font-weight:400}
@font-face{font-family:'CZ';src:url(Cinzel-600.ttf);font-weight:600}
@font-face{font-family:'CZ';src:url(Cinzel-700.ttf);font-weight:700}
@font-face{font-family:'CG';src:url(CormorantGaramond-500i.ttf);font-style:italic;font-weight:500}
:root{--ivory:#F4EEE3;--paper:#ECE3D2;--navy:#1C2631;--slate:#33404E;--gold:#B8925A;--goldl:#E2C892;--brick:#9E4630;--green:#1E3029;--ink:#2A2420}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'NS',serif;color:var(--navy)}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none}
.a{position:absolute}
.cz{font-family:'CZ',serif}
.cg{font-family:'CG',serif;font-style:italic}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gold span,.gold.solo{background-image:linear-gradient(100deg,transparent 0,transparent 1px),linear-gradient(180deg,#F6E3B0 0%,#D6AF6E 45%,#A57A42 100%);background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}
.ch{display:inline-block;will-change:transform}
.card{overflow:hidden;background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 50%}
.frame{border:2px solid var(--gold)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:soft-light;z-index:50}
#vig{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 100%)}
#hud{position:absolute;left:0;top:0;width:1080px;height:200px;z-index:40}
#flash{position:absolute;inset:0;z-index:45;background:radial-gradient(circle at 50% 42%,#FFF6DD 0%,#E8C98A 45%,rgba(184,146,90,0) 80%);opacity:0;pointer-events:none}
#archline{position:absolute;inset:0;z-index:44;pointer-events:none}
#black{position:absolute;inset:0;background:#000;z-index:60;opacity:0}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const EZ={lin:t=>t,oc:t=>1-Math.pow(1-t,3),ic:t=>t*t*t,ioc:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  oe:t=>t>=1?1:1-Math.pow(2,-10*t),ioe:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  oq:t=>1-Math.pow(1-t,5),ob:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},iq:t=>t*t*t*t};
const P=(t,a,b,e=EZ.oc)=>e(cl((t-a)/(b-a)));
const stage=document.getElementById('stage');
function el(tag,parent,css={},html='',cls=''){const e=document.createElement(tag);if(cls)e.className=cls;Object.assign(e.style,css);if(html)e.innerHTML=html;parent.appendChild(e);return e}
function tr(e,{x=0,y=0,s=1,sx=null,sy=null,r=0,o=null,b=0}={}){e.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sx??s},${sy??s})`;if(o!==null)e.style.opacity=o;e.style.filter=b>0.15?`blur(${b.toFixed(2)}px)`:''}
function split(e){const txt=e.textContent;e.textContent='';return [...txt].map(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?' ':c;e.appendChild(s);return s})}
function chars(sp,t,t0,{st=.05,d=.6,y=60,x=0,b=10,s=1,e=EZ.oc,r=0}={}){sp.forEach((c,i)=>{const p=P(t,t0+i*st,t0+i*st+d,e);tr(c,{x:(1-p)*x,y:(1-p)*y,b:(1-p)*b,s:lerp(s,1,p),r:(1-p)*r,o:cl(p*1.6)})})}
function charsOut(sp,t,t0,{st=.02,d=.35,y=-40,b=8}={}){if(t<t0)return;sp.forEach((c,i)=>{const p=P(t,t0+i*st,t0+i*st+d,EZ.ic);tr(c,{y:p*y,b:p*b,o:1-p})})}
function text(parent,str,css,cls=''){const e=el('div',parent,Object.assign({whiteSpace:'nowrap'},css),'',('a '+cls).trim());e.textContent=str;return e}
const SVGNS='http://www.w3.org/2000/svg';
function svg(parent,vb,css){const s=document.createElementNS(SVGNS,'svg');s.setAttribute('viewBox',vb);Object.assign(s.style,css);s.style.position='absolute';s.style.overflow='visible';parent.appendChild(s);return s}
function path(s,d,attrs={}){const p=document.createElementNS(SVGNS,'path');p.setAttribute('d',d);p.setAttribute('class','ln');for(const k in attrs)p.setAttribute(k,attrs[k]);if(attrs.fill)p.style.fill=attrs.fill;s.appendChild(p);return p}
function prepDash(p){const L=p.getTotalLength();p._L=L;p.style.strokeDasharray=L+' '+L;p.style.strokeDashoffset=L;return p}
function draw(p,prog){p.style.strokeDashoffset=p._L*(1-prog)}
const circ=(cx,cy,r)=>`M${cx-r} ${cy} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0`;
function spiral(cx,cy,R,dir=1,turns=2.3){let d='';const n=80;for(let i=0;i<=n;i++){const th=i/n*turns*Math.PI*2;const r=R*(1-i/n*0.85);const x=cx+dir*r*Math.cos(th+Math.PI),y=cy+r*Math.sin(th+Math.PI)*-1;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d}
// seeded random
let _s=12345;const rnd=()=>{_s=(_s*16807)%2147483647;return (_s-1)/2147483646};

/* ========== shared builders ========== */
function facadePaths(){
  const C=[];
  C.push('M30 560 H970','M10 576 H990');
  C.push('M390 560 V300 H610 V560','M380 300 L398 205 H602 L620 300','M402 196 H598');
  C.push('M478 268 V232 A22 22 0 0 1 522 232 V268 Z','M466 236 L500 210 L534 236');
  C.push(circ(432,252,11),circ(568,252,11));
  C.push('M470 205 V100','M500 205 V70','M530 205 V100');
  C.push('M374 300 H626','M384 312 H616');
  for(const x of [405,440,560,595])C.push(`M${x-6} 316 V420 M${x+6} 316 V420`,`M${x-11} 316 H${x+11}`);
  C.push('M390 420 H610','M390 430 H610');
  for(const cx of [415,585])C.push(`M${cx-18} 560 V482 A18 18 0 0 1 ${cx+18} 482 V560`);
  C.push('M445 560 V412 H555 V560','M458 378 A42 36 0 0 1 542 378','M454 378 H546 V392 H454 Z','M500 342 V326',
    'M434 420 L478 398 M522 398 L566 420','M434 420 H566',circ(500,406,9),
    'M456 420 V560 M466 420 V560 M534 420 V560 M544 420 V560','M482 560 V494 A18 18 0 0 1 518 494 V560');
  const Lw=[];
  Lw.push('M140 560 V325 H384','M134 325 L152 262 H384');
  for(const x of [205,265,325])Lw.push(circ(x,294,9),`M${x-15} 294 A15 15 0 0 1 ${x+15} 294`);
  Lw.push('M140 440 H390');
  for(const x of [175,225,275,330])Lw.push(`M${x-12} 420 V386 A12 12 0 0 1 ${x+12} 386 V420 Z`,`M${x-13} 538 V490 A13 13 0 0 1 ${x+13} 490 V538 Z`);
  Lw.push('M70 560 V300 H140 V560','M62 300 Q64 236 105 224 Q146 236 148 300','M105 224 V202',circ(105,334,14),'M92 538 V470 A13 13 0 0 1 118 470 V538 Z','M64 300 H146','M70 440 H140');
  return {C,Lw};
}
function buildFacade(parent,css,stroke='#D9BC8A',sw=2.2){
  const s=svg(parent,'0 0 1000 620',css);const {C,Lw}=facadePaths();const ps=[];
  const g1=document.createElementNS(SVGNS,'g');s.appendChild(g1);
  const g2=document.createElementNS(SVGNS,'g');g2.setAttribute('transform','matrix(-1 0 0 1 1000 0)');s.appendChild(g2);
  const add=(g,d)=>{const p=path(g,d,{stroke,'stroke-width':sw});ps.push(p);return p};
  C.forEach(d=>add(g1,d));Lw.forEach(d=>{add(g1,d);add(g2,d)});
  ps.forEach(p=>{prepDash(p);const bb=p.getBBox();p._y=bb.y+bb.height;p._x=Math.abs(bb.x+bb.width/2-500)});
  return {s,ps};
}
function particles(parent,n,color){const arr=[];for(let i=0;i<n;i++){const d=el('div',parent,{width:'6px',height:'6px',borderRadius:'50%',background:color,boxShadow:`0 0 10px ${color}`},'','a');arr.push({d,x:rnd()*W,y:rnd()*H,sp:20+rnd()*60,sz:.3+rnd()*1.1,ph:rnd()*6.28,a:.25+rnd()*.6})}
  return t=>arr.forEach(p=>{const y=((p.y-t*p.sp)%H+H)%H;const x=p.x+Math.sin(t*.8+p.ph)*20;tr(p.d,{x,y,s:p.sz,o:p.a*(.6+.4*Math.sin(t*2+p.ph))})})}
function setArch(e,p){if(p>=1){e.style.clipPath='none';return null}const w=lerp(0,2700,p),B=2060,h=w*1.35,top=B-h+w/2;const d=`M${540-w/2} ${B} V${top} A${w/2} ${w/2} 0 0 1 ${540+w/2} ${top} V${B} Z`;e.style.clipPath=`path('${d}')`;return d}
function setComb(e,t,t0,dur=.55,n=6,fromTop=true){if(t>=t0+dur+n*.06){e.style.clipPath='none';return}const pts=[];const sw=W/n;
  for(let i=0;i<n;i++){const h=H*P(t,t0+i*.06,t0+i*.06+dur,EZ.ioc);const y=fromTop?h:H-h;pts.push(`${i*sw}px ${y}px`,`${(i+1)*sw}px ${y}px`)}
  const edge=fromTop?'0px':`${H}px`;e.style.clipPath=`polygon(0px ${edge}, ${pts.join(',')}, ${W}px ${edge})`}
function paperBg(parent,base,lines='rgba(184,146,90,.10)'){el('div',parent,{position:'absolute',inset:0,background:base});
  const s=svg(parent,'0 0 1080 1920',{left:0,top:0,width:'1080px',height:'1920px'});
  for(let i=0;i<5;i++)path(s,`M${-100+i*320} 1920 L${400+i*320} 0`,{stroke:lines,'stroke-width':1});
  path(s,circ(540,960,700),{stroke:lines,'stroke-width':1.2});path(s,circ(540,960,760),{stroke:lines,'stroke-width':1,'stroke-dasharray':'2 10'});return s}

/* ========== scenes ========== */
const scenes=[];
function scene(start,end,build,shift=0){const root=el('div',stage,{},'','scene');root.style.display='block';const up=build(root);root.style.display='none';scenes.push({start,end,root,up,shift});}

/* ---------- S1 INTRO 0–6 ---------- */
let introFacade;
scene(0,6.25,root=>{
  el('div',root,{position:'absolute',inset:0,background:'radial-gradient(ellipse 90% 60% at 50% 38%,#2E3D4E 0%,#1A222C 60%,#12171E 100%)'});
  const rings=svg(root,'0 0 1080 1920',{left:0,top:0,width:'1080px',height:'1920px'});
  const r1=path(rings,circ(540,640,430),{stroke:'rgba(226,200,146,.35)','stroke-width':1.5});prepDash(r1);
  const r2=path(rings,circ(540,640,480),{stroke:'rgba(226,200,146,.25)','stroke-width':1,'stroke-dasharray':'3 12'});
  const r3=path(rings,circ(540,640,380),{stroke:'rgba(226,200,146,.18)','stroke-width':1});prepDash(r3);
  const tick=document.createElementNS(SVGNS,'g');rings.appendChild(tick);
  for(let i=0;i<72;i++){const a=i/72*Math.PI*2,r0=i%6?445:438,r1_=i%6?455:462;path(tick,`M${540+Math.cos(a)*r0} ${640+Math.sin(a)*r0} L${540+Math.cos(a)*r1_} ${640+Math.sin(a)*r1_}`,{stroke:'rgba(226,200,146,.45)','stroke-width':1.2})}
  const pt=particles(root,46,'#E8CC90');
  const fac=buildFacade(root,{left:'60px',top:'360px',width:'960px',height:'595px',filter:'drop-shadow(0 0 6px rgba(226,190,120,.55))'});introFacade=fac;
  const latin=text(root,'TAICHUNG PREFECTURAL HALL',{left:0,width:'1080px',top:'1040px',textAlign:'center',fontSize:'30px',letterSpacing:'12px',color:'#E2C892',fontWeight:600},'cz');
  const title=text(root,'臺中州廳',{left:0,width:'1080px',top:'1090px',textAlign:'center',fontSize:'210px',fontWeight:900,letterSpacing:'24px',lineHeight:1.15},'gold');
  const tc=split(title);
  const div=svg(root,'0 0 1080 60',{left:0,top:'1360px',width:'1080px',height:'60px'});
  const dl=path(div,'M540 30 H180',{stroke:'#C9A46A','stroke-width':2});const dr=path(div,'M540 30 H900',{stroke:'#C9A46A','stroke-width':2});prepDash(dl);prepDash(dr);
  const dia=path(div,'M540 14 L556 30 L540 46 L524 30 Z',{stroke:'#E2C892','stroke-width':2,fill:'#1A222C'});
  const sub=text(root,'一分鐘，認識百年州廳',{left:0,width:'1080px',top:'1420px',textAlign:'center',fontSize:'54px',fontWeight:700,letterSpacing:'10px',color:'#F4EEE3'});const sc=split(sub);
  const since=text(root,'— Since 1913 —',{left:0,width:'1080px',top:'1515px',textAlign:'center',fontSize:'44px',color:'#D9BC8A'},'cg');
  const wrap=root;
  return t=>{
    pt(t);
    draw(r1,P(t,.0,1.6,EZ.ioc));draw(r3,P(t,.3,1.9,EZ.ioc));
    rings.style.transformOrigin='540px 640px';
    r2.style.opacity=P(t,.4,1.4);tick.style.opacity=P(t,.6,1.6);
    tick.setAttribute('transform',`rotate(${t*4} 540 640)`);r2.setAttribute('transform',`rotate(${-t*6} 540 640)`);
    fac.ps.forEach(p=>{const st=.15+(1-p._y/620)*1.3+p._x/500*.35;draw(p,P(t,st,st+.9,EZ.ioc))});
    tr(fac.s,{y:lerp(30,0,P(t,0,2.5)),s:1+.03*P(t,0,6,EZ.lin)});
    // title
    const lp=P(t,2.1,3.2,EZ.oq);latin.style.letterSpacing=lerp(40,12,lp)+'px';latin.style.opacity=lp;
    chars(tc,t,2.45,{st:.13,d:.8,y:90,b:22,s:1.35,e:EZ.oq});
    const shine=lerp(-500,1400,P(t,3.7,4.8,EZ.ioc));
    tc.forEach(c=>{c.style.backgroundSize='420px 100%, 100% 100%';c.style.backgroundImage=`linear-gradient(100deg,rgba(255,250,235,0) 30%,rgba(255,250,235,.95) 50%,rgba(255,250,235,0) 70%),linear-gradient(180deg,#F6E3B0 0%,#D6AF6E 45%,#A57A42 100%)`;c.style.backgroundPosition=`${shine-c.offsetLeft}px 0, 0 0`});
    draw(dl,P(t,3.2,4.0,EZ.ioc));draw(dr,P(t,3.2,4.0,EZ.ioc));tr(dia,{});dia.style.opacity=P(t,3.3,3.6);
    chars(sc,t,3.55,{st:.045,d:.5,y:30,b:8});
    since.style.opacity=P(t,4.0,4.6);tr(since,{y:lerp(20,0,P(t,4,4.6)),o:P(t,4.0,4.6)});
    // exit zoom
    const ex=P(t,5.4,6.2,EZ.ic);root.style.transform=`scale(${1+ex*.12})`;root.style.opacity=1-ex*.6;
  }
});

/* ---------- S2 TIMELINE 6–10 ---------- */
scene(5.5,11.4,root=>{
  paperBg(root,'#F3ECE0');
  const g=el('div',root,{position:'absolute',inset:0});
  const tag=text(g,'百年歷程',{left:0,width:'1080px',top:'300px',textAlign:'center',fontSize:'64px',fontWeight:900,letterSpacing:'16px',color:'#1C2631'});const tagc=split(tag);
  const tagL=text(g,'A CENTURY OF HISTORY',{left:0,width:'1080px',top:'395px',textAlign:'center',fontSize:'26px',letterSpacing:'10px',color:'#B8925A',fontWeight:600},'cz');
  // odometer
  const od=el('div',g,{left:'150px',top:'500px',width:'780px',height:'330px'},'','a');
  const cols=[];for(let c=0;c<4;c++){const win=el('div',od,{left:(c*195)+'px',top:0,width:'195px',height:'330px',overflow:'hidden'},'','a');
    const strip=el('div',win,{left:0,top:0,width:'195px'},'','a');for(let k=0;k<21;k++)el('div',strip,{height:'330px',lineHeight:'330px',textAlign:'center',fontSize:'300px',fontWeight:700,color:'#1C2631'},String(k%10),'cz');cols.push(strip)}
  const mask=el('div',od,{left:'-40px',top:0,width:'860px',height:'330px',background:'linear-gradient(180deg,#F3ECE0 0%,rgba(243,236,224,0) 22%,rgba(243,236,224,0) 78%,#F3ECE0 100%)'},'','a');
  const yearLbl=el('div',g,{left:0,width:'1080px',top:'850px',height:'120px'},'','a');
  const evs=[['大正2年','主棟工程動工'],['大正9年','實施州制・正式成為臺中州廳'],['昭和9年','歷經四期擴建・奠定今日規模']];
  const evEls=evs.map(([a,b])=>{const box=el('div',yearLbl,{left:0,top:0,width:'1080px',textAlign:'center'},'','a');
    const t1=el('div',box,{fontSize:'34px',color:'#B8925A',fontWeight:700,letterSpacing:'8px'},a);const t2=el('div',box,{fontSize:'52px',color:'#1C2631',fontWeight:900,marginTop:'10px',letterSpacing:'4px'},b);return {box,c:split(t2),t1}});
  // timeline
  const tl=svg(g,'0 0 1080 300',{left:0,top:'1080px',width:'1080px',height:'300px'});
  const x0=140,x1=940,yr=y=>x0+(y-1913)/21*(x1-x0);
  const base=path(tl,`M${x0} 100 H${x1}`,{stroke:'rgba(28,38,49,.2)','stroke-width':4});prepDash(base);
  const fill=path(tl,`M${x0} 100 H${x1}`,{stroke:'#B8925A','stroke-width':6});prepDash(fill);
  const dots=[1913,1920,1934].map(y=>{const c=path(tl,circ(yr(y),100,16),{stroke:'#B8925A','stroke-width':4,fill:'#F3ECE0'});const c2=path(tl,circ(yr(y),100,7),{fill:'#B8925A',stroke:'none'});return {c,c2,x:yr(y),y}});
  const dlab=[1913,1920,1934].map(y=>text(g,String(y),{left:(yr(y)-80)+'px',width:'160px',textAlign:'center',top:'1220px',fontSize:'40px',fontWeight:700,color:'#1C2631'},'cz'));
  const note=text(g,'設計｜總督府技師 森山松之助',{left:0,width:'1080px',top:'1340px',textAlign:'center',fontSize:'38px',color:'#33404E',fontWeight:700,letterSpacing:'4px'});const notec=split(note);
  const digitsAt=(c,t)=>{const tgt=[1,9,1,3][c];const ie=6.3+.85+c*.12;
    if(t<ie){return lerp(0,tgt+10,P(t,6.25,ie,EZ.oq))}
    let v=tgt;if(c===2)v=lerp(1,2,P(t,7.3,7.9,EZ.ioc))+P(t,8.5,9.1,EZ.ioc);if(c===3)v=lerp(3,10,P(t,7.3,7.9,EZ.ioc))+4*P(t,8.5,9.1,EZ.ioc);return v};
  return t=>{
    setArch(root,P(t,5.55,6.35,EZ.ioe));
    chars(tagc,t,6.15,{st:.07,d:.5,y:50,b:10});tagL.style.opacity=P(t,6.4,6.9);
    cols.forEach((s,c)=>{const v=digitsAt(c,t);s.style.transform=`translateY(${-v*330}px)`;});
    tr(od,{y:lerp(40,0,P(t,6.2,6.8)),o:P(t,6.2,6.6)});
    const year=t<7.3?1913:t<8.5?lerp(1913,1920,P(t,7.3,7.9,EZ.ioc)):lerp(1920,1934,P(t,8.5,9.1,EZ.ioc));
    draw(base,P(t,6.3,7.0,EZ.ioc));
    draw(fill,P(t,6.6,7.1)*(year-1913)/21+0);
    dots.forEach((d,i)=>{const on=year>=d.y-.01&&t>6.6;const pp=on?P(t,[6.7,7.9,9.1][i],[6.7,7.9,9.1][i]+.4,EZ.ob):0;d.c2.style.transformOrigin=`${d.x}px 100px`;d.c2.style.transform=`scale(${pp})`;d.c.style.opacity=P(t,6.5+i*.1,6.9+i*.1)});
    dlab.forEach((l,i)=>{const act=[t<7.6,t>=7.6&&t<8.8,t>=8.8][i];tr(l,{o:P(t,6.6+i*.1,7+i*.1)*(act?1:.35),s:act?1.12:1})});
    const sw=[[6.75,7.55],[7.6,8.75],[8.8,99]];
    evEls.forEach((e,i)=>{const [a,b]=sw[i];e.box.style.display=(t>=a-.01&&t<b+.4)?'block':'none';chars(e.c,t,a,{st:.035,d:.45,y:40,b:8});e.t1.style.opacity=P(t,a,a+.3);if(t>b){charsOut(e.c,t,b,{});e.t1.style.opacity=1-P(t,b,b+.25)}});
    chars(notec,t,8.9,{st:.03,d:.4,y:24,b:6});
    const ex=P(t,10.55,11.15,EZ.ic);tr(g,{y:-ex*160,o:1-ex});
  }
});

/* ---------- S3 FACADE 10–16 ---------- */
scene(10.6,17.3,root=>{
