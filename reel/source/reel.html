<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/500-italic.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 66.5;
let FAST = false;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { paper: '#F2ECE1', paper2: '#E7DDCB', ink: '#2A2724', ink2: '#57524A', faint: '#9A9182', line: '#CFC4B0',
  red: '#B5382B', jade: '#3F7A64', ochre: '#B07F2E', indigo: '#2E4A6B', plum: '#6F4A66' };

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, s, d) => cl((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eO = x => 1 - Math.pow(1 - x, 4);           // quart out
const eIO = x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2;
const eI = x => x * x * x;
const eS = x => x * x * (3 - 2 * x);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');
const ZH = ['壹', '貳', '參', '肆', '伍', '陸', '柒', '捌'];

// ---------- type ----------
const FAM = { S: '"Noto Serif TC"', N: '"Cormorant Garamond","Noto Serif TC"', NI: '"Cormorant Garamond","Noto Serif TC"', SANS: '"Noto Sans TC"' };
function font(size, weight = 700, fam = 'S') { ctx.font = `${fam === 'NI' ? 'italic ' : ''}${weight} ${size}px ${FAM[fam]}`; }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 700, fam = 'S', color = P.ink, align = 'center', ls = 0, alpha = 1 } = o;
  ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, o = {}) { const { size = 60, weight = 700, fam = 'S', ls = 0 } = o; ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// ink-bleed reveal: per char blur->sharp, fade, slight rise
function inkIn(s, x, y, o, t, start, stagger = .05, dur = .9, out = null) {
  const { align = 'center' } = o;
  const total = measure(s, o);
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  [...s].forEach((ch, i) => {
    const k = eO(pr(t, start + i * stagger, dur)); if (k <= 0) return;
    let a = k, dy = (1 - k) * 22;
    if (out != null) { const ko = eI(pr(t, out + i * stagger * .3, .5)); a *= 1 - ko; dy -= ko * 18; }
    if (a <= 0) return;
    const cx = x0 + measure(s.slice(0, i), o);
    ctx.save(); const b = (1 - k) * 10; if (b > .3 && !FAST) ctx.filter = `blur(${b.toFixed(1)}px)`;
    txt(ch, cx, y + dy, { ...o, align: 'left', alpha: (o.alpha ?? 1) * a }); ctx.restore();
  });
}
// vertical text (top->bottom)
function vtext(s, x, y, o, t, start, stagger = .06) {
  const size = o.size || 30, gap = o.gap ?? size * 1.25;
  [...s].forEach((ch, i) => { const k = eO(pr(t, start + i * stagger, .8)); if (k <= 0) return; txt(ch, x, y + i * gap + (1 - k) * 12, { ...o, alpha: (o.alpha ?? 1) * k }); });
}

// ---------- ink brush ----------
function brushPath(ptsFn, n, w, k, color, seed, alpha = 1, dry = .35) {
  // ptsFn(u)->[x,y,nx,ny]; draws `n` hair lines across width w, each trimmed differently (dry brush)
  if (k <= 0 || FAST) return;
  const base = ctx.globalAlpha;
  ctx.save(); ctx.strokeStyle = color; ctx.lineCap = 'round';
  const steps = 90;
  for (let h = 0; h < n; h++) {
    const off = (h / (n - 1) - .5) * w;
    const r1 = hash(seed + h * 3.1), r2 = hash(seed + h * 7.7);
    const end = k * (1 - dry * r2 * (Math.abs(off) / (w / 2)));      // outer hairs end earlier
    const st = .015 * r1;
    ctx.globalAlpha = base * alpha * (.55 + .45 * r1);
    ctx.lineWidth = w / n * 1.9;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u = st + (end - st) * i / steps; if (u < st) continue;
      const [x, y, nx, ny] = ptsFn(u);
      const taper = Math.sin(Math.PI * cl(u / Math.max(.001, end)) * .5 + .15) ; // thicker near start
      const o2 = off * (0.65 + .35 * taper);
      const px = x + nx * o2, py = y + ny * o2;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function brushLine(x0, y0, x1, y1, w, k, color, seed = 1, alpha = 1) {
  const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l;
  brushPath(u => [x0 + dx * u + Math.sin(u * 6 + seed) * 2, y0 + dy * u + Math.sin(u * 9 + seed) * 2, nx, ny], 12, w, k, color, seed, alpha);
}
function enso(cx, cy, r, from, span, w, k, color, seed = 3, alpha = .92) {
  brushPath(u => { const a = from + span * u; const rr = r * (1 + .02 * Math.sin(u * 7 + seed)); return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, Math.cos(a), Math.sin(a)]; }, 18, w, k, color, seed, alpha, .55);
}
// seal stamp (朱文/白文)
const speck = (() => { const c = document.createElement('canvas'); c.width = c.height = 240; const x = c.getContext('2d'); x.fillStyle = P.paper; for (let i = 0; i < 260; i++) { x.globalAlpha = .3 + Math.random() * .6; x.beginPath(); x.arc(Math.random() * 240, Math.random() * 240, Math.random() * 2.4, 0, 7); x.fill(); } return c; })();
function seal(cx, cy, size, text, k, rot = -.04, color = P.red) {
  if (k <= 0) return;
  const s = lerp(1.35, 1, eO(k)), a = cl(k * 3);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha *= a * .92;
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(-size / 2, -size / 2, size, size, size * .08); ctx.fill();
  const chars = [...text]; ctx.fillStyle = P.paper;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (chars.length === 1) { font(size * .68, 900); ctx.fillText(chars[0], 0, size * .03); }
  else if (chars.length === 2) { font(size * .4, 900); ctx.fillText(chars[0], 0, -size * .2); ctx.fillText(chars[1], 0, size * .23); }
  else { font(size * .36, 900); const q = [[.21, -.21], [.21, .23], [-.21, -.21], [-.21, .23]]; chars.forEach((c, i) => ctx.fillText(c, q[i][0] * size, q[i][1] * size)); }
  ctx.globalCompositeOperation = 'source-atop'; ctx.drawImage(speck, -size / 2, -size / 2, size, size);
  ctx.restore();
}
function hair(x0, y0, x1, y1, k, color = P.line, lw = 2, alpha = 1) {
  if (k <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke(); ctx.restore();
}
function inkBar(x, y, w, h, color, k, seed = 1, alpha = .9) {
  if (k <= 0 || w <= 0) return;
  const ww = w * k;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x + ww - h * .3, y); ctx.quadraticCurveTo(x + ww + h * .15, y + h * .5, x + ww - h * .3, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  // dry streaks
  ctx.globalAlpha = .18; ctx.strokeStyle = P.paper; ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) { const yy = y + h * (.2 + .2 * i) + hash(seed + i) * 3; const sx = x + ww * (.35 + .5 * hash(seed + i * 2)); ctx.beginPath(); ctx.moveTo(sx, yy); ctx.lineTo(x + ww, yy); ctx.stroke(); }
  ctx.restore();
}
function dot(x, y, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); ctx.restore(); }

// ---------- paper + landscape (pre-rendered) ----------
const paper = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = P.paper; x.fillRect(0, 0, W, H);
  const im = x.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  x.putImageData(im, 0, 0);
  // fibres
  x.strokeStyle = '#8A7A60'; x.lineCap = 'round';
  for (let i = 0; i < 1600; i++) {
    x.globalAlpha = .025 + Math.random() * .04; x.lineWidth = .6 + Math.random();
    const px = Math.random() * W, py = Math.random() * H, a = Math.random() * Math.PI, l = 8 + Math.random() * 40;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + 4, py + Math.sin(a) * l * .5 - 4, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  // soft stains
  for (let i = 0; i < 9; i++) {
    const px = Math.random() * W, py = Math.random() * H, r = 150 + Math.random() * 380;
    const g = x.createRadialGradient(px, py, 0, px, py, r); g.addColorStop(0, 'rgba(176,150,110,.07)'); g.addColorStop(1, 'rgba(176,150,110,0)');
    x.globalAlpha = 1; x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  // edge darkening
  const v = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .78); v.addColorStop(0, 'rgba(120,95,60,0)'); v.addColorStop(1, 'rgba(120,95,60,.16)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c;
})();
function ridge(seed, amp, base, w, rough) {
  const c = document.createElement('canvas'); c.width = w; c.height = 700; const x = c.getContext('2d');
  const pts = [];
  for (let i = 0; i <= w; i += 4) {
    let y = base;
    y -= amp * (.55 * Math.sin(i * .004 + seed) + .3 * Math.sin(i * .011 + seed * 2) + .15 * Math.sin(i * .031 + seed * 3)) ;
    y -= rough * Math.sin(i * .09 + seed) * Math.sin(i * .013);
    pts.push([i, y]);
  }
  const g = x.createLinearGradient(0, base - amp, 0, 700); g.addColorStop(0, 'rgba(42,39,36,.85)'); g.addColorStop(.35, 'rgba(42,39,36,.25)'); g.addColorStop(1, 'rgba(42,39,36,0)');
  x.fillStyle = g; x.beginPath(); x.moveTo(0, 700); pts.forEach(p => x.lineTo(...p)); x.lineTo(w, 700); x.closePath(); x.fill();
  // ink edge
  x.strokeStyle = 'rgba(42,39,36,.5)'; x.lineWidth = 2; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.stroke();
  return c;
}
const mtns = [ridge(1.3, 120, 330, 1800, 10), ridge(4.1, 90, 420, 1800, 14), ridge(7.7, 70, 520, 1800, 8)];
function landscape(t, alpha, rise = 0) {
  if (alpha <= 0 || FAST) return;
  const al = [.07, .11, .16];
  mtns.forEach((m, i) => {
    const x = -((t * (6 + i * 5)) % 600) - 100 * i;
    ctx.save(); ctx.globalAlpha = alpha * al[i]; ctx.drawImage(m, x, H - 700 + 60 + rise * (i + 1) * 20); ctx.restore();
  });
  // mist band
  const g = ctx.createLinearGradient(0, H - 420, 0, H - 200); g.addColorStop(0, 'rgba(242,236,225,0)'); g.addColorStop(.6, 'rgba(242,236,225,.35)'); g.addColorStop(1, 'rgba(242,236,225,0)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 420, W, 220);
}
// birds (simple brush ticks)
function birds(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a * .5; ctx.strokeStyle = P.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const x = 760 + i * 46 + t * 14 + Math.sin(i) * 20, y = 1300 - i * 22 + Math.sin(t * 1.3 + i) * 6, f = Math.sin(t * 5 + i * 1.7) * 5;
    ctx.beginPath(); ctx.moveTo(x - 12, y - 2 + f); ctx.quadraticCurveTo(x - 5, y - 6 + f * .3, x, y); ctx.quadraticCurveTo(x + 5, y - 6 + f * .3, x + 12, y - 2 + f); ctx.stroke();
  }
  ctx.restore();
}

// ---------- chrome ----------
function hud(t) {
  if (t < 8.3 || t > 63.6) return;
  const a = Math.min(pr(t, 8.3, .8), 1 - pr(t, 63, .6));
  const si = Math.min(7, Math.floor(t / 8));
  ctx.save(); ctx.globalAlpha = a;
  txt('臺中市藝文網　九至十月填報快報', 90, 168, { size: 28, weight: 500, color: P.ink2, align: 'left', ls: 4 });
  txt(ZH[si] + '／捌', W - 90, 170, { size: 30, weight: 700, color: P.ink2, align: 'right', ls: 4 });
  hair(90, 200, W - 90, 200, 1, P.line, 1.5);
  const k = cl(t / 64); dot(90 + (W - 180) * k, 200, 6, P.red);
  hair(90, 200, 90 + (W - 180) * k, 200, 1, P.ink2, 1.5, .8);
  txt('統計至 115.10.31　資料來源：藝文網策進會議', W / 2, 1700, { size: 24, weight: 500, color: P.faint, ls: 3 });
  ctx.restore();
}
// section header: seal numeral + title + italic en + sub
function header(u, si, zh, en, sub, col = P.red) {
  const out = 7.2;
  const ko = eI(pr(u, out, .5));
  ctx.save(); ctx.globalAlpha *= 1 - ko;
  seal(124, 330, 68, ZH[si], pr(u, .2, .5), -.05, col);
  inkIn(en, 180, 316, { size: 34, weight: 500, fam: 'NI', color: P.ink2, align: 'left', ls: 3 }, u, .35, .02, .7);
  inkIn(zh, 90, 460, { size: 80, weight: 900, align: 'left', ls: 6 }, u, .4, .06, .9);
  brushLine(92, 492, 92 + Math.min(560, measure(zh, { size: 80, weight: 900, ls: 6 }) * .55), 488, 9, eO(pr(u, .9, .9)), col, si * 3 + 1, .85);
  if (sub) inkIn(sub, 92, 548, { size: 30, weight: 500, color: P.ink2, align: 'left', ls: 2 }, u, 1.0, .015, .7);
  ctx.restore();
}
const outK = u => eI(pr(u, 7.15, .55));

// ================= SCENES =================
function S1(t) {
  const u = t, cx = W / 2;
  landscape(t, eS(pr(u, 0, 2.5)), 1 - eO(pr(u, 0, 3)));
  birds(t - 3, pr(u, 3.5, 1.5));
  const ko = eI(pr(u, 7.1, .7));
  ctx.save(); ctx.globalAlpha = 1 - ko;
  // ensō behind the title
  enso(cx, 860, 330, -Math.PI * .62, Math.PI * 1.82, 34, eIO(pr(u, .3, 2.2)), P.ink, 5, .82);
  vtext('臺中市政府文化局', W - 110, 330, { size: 30, weight: 500, color: P.ink2 }, u, 1.0, .07);
  vtext('藝文網', 110, 1250, { size: 30, weight: 500, color: P.ink2 }, u, 1.6, .1);
  inkIn('一一五年', cx, 660, { size: 40, weight: 500, color: P.ink2, ls: 18 }, u, 1.0, .1, .9);
  inkIn('九至十月', cx, 860, { size: 170, weight: 900, ls: 10 }, u, 1.4, .16, 1.2);
  inkIn('藝文活動填報', cx, 1010, { size: 74, weight: 700, ls: 16 }, u, 2.3, .08, 1);
  inkIn('成績單', cx, 1120, { size: 74, weight: 700, ls: 30, color: P.red }, u, 2.9, .12, 1);
  seal(cx + 210, 1200, 92, '快報', pr(u, 4.0, .45), .06);
  inkIn('Arts Calendar · Reporting Review', cx, 1290, { size: 36, weight: 500, fam: 'NI', color: P.ink2, ls: 2 }, u, 4.4, .015, .8);
  ctx.restore();
}

function S2(t) {
  const u = t - 8, ok = outK(u), cx = W / 2;
  header(u, 1, '申報總覽', 'Overview', '九至十月各機關於藝文網申報活動之審核結果');
  ctx.save(); ctx.globalAlpha = 1 - ok; ctx.translate(0, -ok * 40);
  inkIn('申報總件數', cx, 680, { size: 36, weight: 500, color: P.ink2, ls: 14 }, u, .8, .06, .8);
  const ck = eO(pr(u, .9, 2));
  if (u > .9) {
    ctx.save(); const b = (1 - eO(pr(u, .9, .8))) * 12; if (b > .3) ctx.filter = `blur(${b}px)`;
    txt(fmt(1033 * ck), cx - 30, 900, { size: 260, weight: 600, fam: 'N', alpha: cl(pr(u, .9, .6)) }); ctx.restore();
    txt('件', cx + 250, 892, { size: 54, weight: 700, color: P.red, alpha: cl(pr(u, 1.8, .6)) });
  }
  // split ink bar
  const bx = 90, bw = 900, by = 1000, bh = 30;
  hair(bx, by + bh + 14, bx + bw, by + bh + 14, eO(pr(u, 1.8, .8)), P.line, 1.5);
  const segs = [[962, P.jade], [41, P.red], [30, P.ochre]];
  let acc = 0;
  segs.forEach(([v, c], i) => { const k = eO(pr(u, 2.0 + i * .3, 1)); inkBar(bx + acc, by, bw * v / 1033 - (i < 2 ? 4 : 0), bh, c, k, i + 3); acc += bw * v / 1033 * (i === 0 ? 1 : k); });
  // three columns
  const cols = [['通過', 962, '93.1%', P.jade], ['退回', 41, '4.0%', P.red], ['待審核', 30, '2.9%', P.ochre]];
  cols.forEach(([lab, v, pct, c], i) => {
    const st = 2.6 + i * .3, a = eO(pr(u, st, .9)); if (a <= 0) return;
    const x = 90 + i * 310;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * 20);
    if (i) hair(x - 20, 1090, x - 20, 1330, 1, P.line, 1.5);
    txt(lab, x + 10, 1140, { size: 38, weight: 700, color: P.ink, align: 'left', ls: 4 });
    dot(x + 10 + measure(lab, { size: 38, weight: 700, ls: 4 }) + 10, 1128, 6, c);
    txt(fmt(v * eO(pr(u, st, 1.4))), x + 6, 1270, { size: 130, weight: 600, fam: 'N', color: c, align: 'left' });
    txt('占 ' + pct, x + 10, 1320, { size: 30, weight: 500, color: P.ink2, align: 'left' });
    ctx.restore();
  });
  // closing line
  inkIn('通過率 93.1%，整體品質穩定', cx - 70, 1480, { size: 46, weight: 700, ls: 4 }, u, 4.6, .05, .9);
  brushLine(cx - 330, 1510, cx + 190, 1506, 8, eO(pr(u, 5.4, .9)), P.jade, 21, .7);
  seal(cx + 360, 1466, 76, '佳', pr(u, 5.6, .45), .08, P.jade);
  ctx.restore();
}

function S3(t) {
  const u = t - 16, ok = outK(u), cx = W / 2, cy = 900, R = 250;
  header(u, 2, '年度累計進度', 'Year to Date', '一一五年累計通過數，對比一一四年同期');
  ctx.save(); ctx.globalAlpha = 1 - ok; ctx.translate(0, -ok * 40);
  // faint full circle guide
  ctx.save(); ctx.setLineDash([3, 12]); ctx.strokeStyle = P.faint; ctx.globalAlpha *= .6 * cl(pr(u, .4, .6)); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  // ensō to 80.5%
  const k = eIO(pr(u, .6, 2.6));
  enso(cx, cy, R, -Math.PI / 2, Math.PI * 2 * .805, 46, k, P.ink, 9, .9);
  // gap mark
  const ga = -Math.PI / 2 + Math.PI * 2 * .805, gb = -Math.PI / 2 + Math.PI * 2;
  ctx.save(); ctx.globalAlpha *= eO(pr(u, 3.2, .8)); ctx.strokeStyle = P.red; ctx.lineWidth = 3; ctx.setLineDash([8, 9]); ctx.beginPath(); ctx.arc(cx, cy, R + 42, ga + .05, gb); ctx.stroke(); ctx.restore();
  txt('差距', cx + Math.cos((ga + gb) / 2) * (R + 92), cy + Math.sin((ga + gb) / 2) * (R + 92) + 10, { size: 28, weight: 700, color: P.red, alpha: eO(pr(u, 3.5, .6)) });
  txt((80.5 * eO(pr(u, .6, 2.6))).toFixed(1), cx - 20, cy + 40, { size: 170, weight: 600, fam: 'N', alpha: cl(pr(u, .7, .6)) });
  txt('%', cx + 140, cy + 38, { size: 70, weight: 500, fam: 'N', color: P.red, alpha: cl(pr(u, .7, .6)) });
  txt('達去年同期', cx, cy + 105, { size: 34, weight: 500, color: P.ink2, ls: 10, alpha: cl(pr(u, 1.3, .6)) });
  // comparison
  [['一一五年 累計通過', 4887, P.ink], ['一一四年 同期通過', 6069, P.faint]].forEach(([lab, v, c], i) => {
    const y = 1270 + i * 120, st = 2.2 + i * .3, a = eO(pr(u, st, .8));

// ---------- transitions: ink wash bloom + red hairline ----------
function transition(t) {
  [8, 16, 24, 32, 40, 48, 56].forEach((b, i) => {
    const d = t - b; if (d < -.7 || d > .8) return;
    // wash: spreads then fades
    const k = pr(d, -.7, 1.5), a = Math.sin(Math.PI * k);
    const cx = i % 2 ? W * .7 : W * .3, cy = H * (.4 + .1 * (i % 3));
    for (let j = 0; j < 5; j++) {
      const r = (300 + j * 160) * eO(k) + 50;
      const x = cx + Math.cos(j * 2.3 + i) * 120 * k, y = cy + Math.sin(j * 1.7 + i) * 160 * k;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(42,39,36,${.10 * a})`); g.addColorStop(.6, `rgba(42,39,36,${.05 * a})`); g.addColorStop(1, 'rgba(42,39,36,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    // paper veil at the cut
    const v = Math.exp(-(d * d) / .04);
    ctx.save(); ctx.globalAlpha = .85 * v; ctx.drawImage(paper, 0, 0); ctx.restore();
    // vermilion hairline draws then retracts
    const l1 = eIO(pr(d, -.6, .6)), l2 = eIO(pr(d, 0, .6));
    if (l1 > l2) hair(lerp(90, W - 90, l2), H / 2, lerp(90, W - 90, l1), H / 2, 1, P.red, 3, .9);
  });
}

const SCENES = [S1, S2, S3, S4, S5, S6, S7, S8];
function render(t) {

  ctx.drawImage(paper, 0, 0);
  // large watermark character, slowly drifting
  ctx.save(); ctx.globalAlpha = .035; font(900, 900); ctx.fillStyle = P.ink; ctx.textAlign = 'center'; ctx.fillText('藝', W * .62 + Math.sin(t * .1) * 20, 1500 - t * 2); ctx.restore();
  const si = Math.min(7, Math.floor(t / 8));
  if (si >= 1 && si <= 6) landscape(t, .45);
  ctx.save(); const z = 1 + (t % 8) * .0012; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES[si](t);
  ctx.restore();
  hud(t);
  transition(t);
  const ff = pr(t, 65.6, .9); if (ff > 0) { ctx.fillStyle = `rgba(242,236,225,${ff})`; ctx.fillRect(0, 0, W, H); }
}

async function prepare() {
  const all = new Set('0123456789,.%–/<>');
  const of = ctx.fillText; ctx.fillText = function (s) { for (const ch of s) all.add(ch); };
  FAST = true; for (let t = 0; t < DUR; t += 1 / 10) render(t); FAST = false;
  ctx.fillText = of;
  ['藝', '快報', '佳', '冠', '一二三四', '壹貳參肆伍陸柒捌', '藝文網'].forEach(s => [...s].forEach(c => all.add(c)));
  const str = [...all].join('');
  await Promise.all([
    ...[500, 700, 900].map(w => document.fonts.load(`${w} 40px "Noto Serif TC"`, str)),
    document.fonts.load(`500 40px "Noto Sans TC"`, str),
    document.fonts.load(`500 40px "Cormorant Garamond"`, str), document.fonts.load(`600 40px "Cormorant Garamond"`, str),
    document.fonts.load(`italic 500 40px "Cormorant Garamond"`, str),
  ]);
  await document.fonts.ready;
  window.__ready = true;
}
window.render = render;
prepare();
