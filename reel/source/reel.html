<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/barlow-condensed/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/barlow-condensed/800.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 66.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { bg0:'#070B22', bg1:'#11184A', teal:'#21E6C1', coral:'#FF5A6E', amber:'#FFC23D', violet:'#8A6BFF', sky:'#3FB2FF', white:'#F4F6FF', mute:'#8E98C8', dim:'#2A3370', gold:'#FFD166' };

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, s, d) => cl((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eOE = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eIE = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eOC = x => 1 - Math.pow(1 - x, 3);
const eIC = x => x * x * x;
const eIOC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOB = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eIOE = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');
const BEAT = .5;
function drumsOn(t) { return (t >= 8 && t < 40) || (t >= 48 && t < 64); }
function kick(t) { const on = drumsOn(t) ? 1 : (t >= 4 && t < 8) || (t >= 44 && t < 48) ? .5 : 0; return on * Math.exp(-(t % BEAT) / .09); }

// ---------- drawing helpers ----------
const FAM = { TC: '"Noto Sans TC"', N: '"Barlow Condensed","Noto Sans TC"' };
function font(size, weight = 700, fam = 'TC') { ctx.font = `${weight} ${size}px ${FAM[fam]}`; }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 700, fam = 'TC', color = P.white, align = 'center', ls = 0, alpha = 1, base = 'alphabetic' } = o;
  ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = base; ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, o = {}) {
  const { size = 60, weight = 700, fam = 'TC', ls = 0 } = o;
  ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
// per-character masked rise-in
function charsIn(s, x, y, o, t, start, stagger = .035, dur = .6, out = null) {
  const { size = 60, align = 'center' } = o;
  const chars = [...s];
  const total = measure(s, o);
  let x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y - size * 1.15, W, size * 1.5); ctx.clip();
  let acc = 0;
  chars.forEach((ch, i) => {
    const k = eOE(pr(t, start + i * stagger, dur));
    let dy = (1 - k) * size * 1.2;
    let a = k;
    if (out) { const ko = eIC(pr(t, out + i * stagger * .5, .35)); dy -= ko * size * 1.2; }
    const cx = x0 + measure(s.slice(0, i), o);
    txt(ch, cx, y + dy, { ...o, align: 'left', alpha: (o.alpha ?? 1) * a });
  });
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), h, Math.min(r, Math.max(0, w) / 2, h / 2)); }
function fillRR(x, y, w, h, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; rr(x, y, w, h, r); ctx.fill(); ctx.restore(); }
function strokeRR(x, y, w, h, r, c, lw = 2, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = lw; rr(x, y, w, h, r); ctx.stroke(); ctx.restore(); }
function arc(cx, cy, r, a0, a1, c, lw, cap = 'round', a = 1) { if (a1 - a0 < 1e-4) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = cap; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke(); ctx.restore(); }
function circle(cx, cy, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, Math.max(0, r), 0, 7); ctx.fill(); ctx.restore(); }
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function grad(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function check(x, y, s, k, c, lw = 8) { // animated check mark
  ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .42]];
  const l1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), l2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
  const d = k * (l1 + l2);
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  if (d <= l1) ctx.lineTo(lerp(pts[0][0], pts[1][0], d / l1), lerp(pts[0][1], pts[1][1], d / l1));
  else { ctx.lineTo(...pts[1]); const q = (d - l1) / l2; ctx.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  ctx.stroke(); ctx.restore();
}
function warnIcon(x, y, s, c, k) {
  ctx.save(); ctx.translate(x, y); ctx.scale(eOB(k), eOB(k)); ctx.strokeStyle = c; ctx.lineWidth = s * .1; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, -s * .5); ctx.lineTo(s * .55, s * .45); ctx.lineTo(-s * .55, s * .45); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = c; ctx.fillRect(-s * .05, -s * .18, s * .1, s * .34); ctx.beginPath(); ctx.arc(0, s * .3, s * .06, 0, 7); ctx.fill(); ctx.restore();
}
function crown(x, y, s, c) {
  ctx.save(); ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x - s * .5, y + s * .3); ctx.lineTo(x - s * .5, y - s * .2); ctx.lineTo(x - s * .22, y + s * .05); ctx.lineTo(x, y - s * .35);
  ctx.lineTo(x + s * .22, y + s * .05); ctx.lineTo(x + s * .5, y - s * .2); ctx.lineTo(x + s * .5, y + s * .3); ctx.closePath(); ctx.fill(); ctx.restore();
}

// ---------- grain ----------
const grains = [];
for (let g = 0; g < 4; g++) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const im = x.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); grains.push(c);
}

// ---------- background ----------
const SECT_COL = [P.teal, P.sky, P.teal, P.violet, P.gold, P.coral, P.amber, P.teal, P.teal];
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W * .3, H); g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const si = Math.min(8, Math.floor(t / 8));
  const acc = SECT_COL[si];
  // drifting blobs
  const blobs = [[.2, .25, acc, 620], [.85, .7, P.violet, 700], [.3, .95, P.sky, 560]];
  blobs.forEach(([bx, by, c, r], i) => {
    const x = W * bx + Math.sin(t * .35 + i * 2) * 120, y = H * by + Math.cos(t * .28 + i) * 140;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r * (1 + kick(t) * .04));
    rg.addColorStop(0, c + '38'); rg.addColorStop(1, c + '00'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  // perspective dot grid
  ctx.save(); ctx.globalAlpha = .22; ctx.fillStyle = '#9FB0FF';
  const off = (t * 22) % 60;
  for (let y = -60; y < H + 60; y += 60) for (let x = 0; x < W + 60; x += 60) {
    const yy = y + off; const d = Math.hypot(x - W / 2, yy - H * .45) / 1200;
    ctx.globalAlpha = .18 * (1 - d) * (1 + kick(t) * .6);
    ctx.fillRect(x - 1.5, yy - 1.5, 3, 3);
  }
  ctx.restore();
  // particles
  for (let i = 0; i < 46; i++) {
    const sp = 20 + hash(i) * 60;
    const x = (hash(i + 9) * W + Math.sin(t * .5 + i) * 30);
    const y = ((hash(i + 3) * H - t * sp) % H + H) % H;
    circle(x, y, 1.5 + hash(i + 5) * 3, i % 3 ? P.white : acc, .25 + .3 * hash(i + 7));
  }
}
function marquee(t, y, text, speed, alpha, size = 170) {
  ctx.save(); font(size, 900, 'N'); ctx.letterSpacing = '6px';
  const w = ctx.measureText(text).width; let x = -((t * speed) % w + w) % w;
  ctx.globalAlpha = alpha; ctx.strokeStyle = P.white; ctx.lineWidth = 2;
  for (; x < W; x += w) ctx.strokeText(text, x, y);
  ctx.restore();
}

// ---------- HUD ----------
const SCENES = ['', '申報總覽', '年度累計', '系統比較', '填報最多', '偏少掛零', '注意重點', '衝刺建議'];
function hud(t) {
  if (t < 8.2 || t > 63.5) return;
  const a = Math.min(pr(t, 8.2, .5), 1 - pr(t, 63, .5));
  ctx.save(); ctx.globalAlpha = a;
  const si = Math.min(7, Math.floor(t / 8));
  txt('臺中市藝文網 · 9–10月填報快報', 90, 175, { size: 30, weight: 700, color: P.mute, align: 'left', ls: 3 });
  txt(String(si + 1).padStart(2, '0'), W - 160, 178, { size: 44, weight: 800, fam: 'N', color: SECT_COL[si], align: 'right' });
  txt('/ 08', W - 90, 178, { size: 30, weight: 600, fam: 'N', color: P.mute, align: 'right' });
  // segmented progress
  for (let i = 0; i < 8; i++) {
    const x = 90 + i * 113, w = 101;
    fillRR(x, 205, w, 6, 3, P.white, .14);
    const k = cl((t - i * 8) / 8);
    if (k > 0) fillRR(x, 205, w * k, 6, 3, i === si ? SECT_COL[si] : P.white, i === si ? 1 : .55);
  }
  // reel timecode
  const f = Math.floor(t * FPS);
  const tc = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(Math.floor(t % 60)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
  circle(98, 1690, 7, P.coral, .6 + .4 * Math.sin(t * 6));
  txt('REC  ' + tc, 116, 1700, { size: 28, weight: 600, fam: 'N', color: P.mute, align: 'left', ls: 3 });
  txt('資料統計至 115.10.31', W - 90, 1700, { size: 26, weight: 500, color: P.mute, align: 'right', ls: 2 });
  ctx.restore();
}

// section title block
function title(u, tag, en, zh, col, sub) {
  const out = 7.25;
  const k = eOE(pr(u, .15, .7)), ko = eIC(pr(u, out, .4));
  ctx.save(); ctx.globalAlpha = 1 - ko;
  // tag box
  const tw = 70 * k;
  fillRR(90, 268, tw, 52, 8, col);
  if (k > .6) txt(tag, 90 + 35, 307, { size: 38, weight: 800, fam: 'N', color: P.bg0 });
  charsIn(en, 180, 307, { size: 32, weight: 600, fam: 'N', color: col, align: 'left', ls: 8 }, u, .3, .02, .5);
  charsIn(zh, 90, 410, { size: 78, weight: 900, align: 'left', ls: 2 }, u, .35, .04, .6, out);
  if (sub) charsIn(sub, 92, 462, { size: 32, weight: 500, color: P.mute, align: 'left', ls: 2 }, u, .7, .015, .5, out);
  ctx.restore();
}
function outK(u) { return eIC(pr(u, 7.2, .45)); }

// ================= SCENES =================
function S1(t) { // intro 0-8
  const u = t;
  marquee(u, 380, 'DATA REEL · 藝文網 · ', 60, .07 * pr(u, .3, 1));
  marquee(u, 1620, '115 · SEP–OCT · 填報 · ', -80, .07 * pr(u, .3, 1));
  const cx = W / 2, cy = 860, kk = kick(u);
  const zoom = 1 + eIE(pr(u, 7, 1)) * 2.2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);
  // opening line
  const l = eOE(pr(u, 0, .6)), lo = eIOC(pr(u, .55, .5));
  if (lo < 1) { ctx.save(); ctx.strokeStyle = P.teal; ctx.lineWidth = 4; ctx.globalAlpha = 1 - lo; ctx.beginPath(); ctx.moveTo(cx - 420 * l, cy); ctx.lineTo(cx + 420 * l, cy); ctx.stroke(); ctx.restore(); }
  // rings
  const rk = eOE(pr(u, .5, 1.6));
  const R = 380 + kk * 10;
  arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rk, P.teal, 6, 'round', .9);
  ctx.save(); ctx.setLineDash([4, 18]); arc(cx, cy, R + 50, u * .3, u * .3 + Math.PI * 2 * rk, P.white, 3, 'butt', .35); ctx.restore();
  arc(cx, cy, R - 40, Math.PI - u * .6, Math.PI - u * .6 + 1.4 * rk, P.violet, 10, 'round', .8);
  arc(cx, cy, R - 40, -u * .6, -u * .6 + .8 * rk, P.coral, 10, 'round', .8);
  for (let i = 0; i < 3; i++) { const a = u * (1 + i * .4) + i * 2; circle(cx + Math.cos(a) * (R + 50), cy + Math.sin(a) * (R + 50), 9, [P.teal, P.amber, P.coral][i], rk); }
  // burst on drop (t=4)
  const bk = pr(u, 4, 1.2);
  if (bk > 0 && bk < 1) for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2; const d = R + eOE(bk) * 360; circle(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 7 * (1 - bk), i % 2 ? P.teal : P.amber, 1 - bk); }
  // text
  charsIn('臺中市政府文化局 · 藝文網', cx, 610, { size: 42, weight: 700, color: P.mute, ls: 10 }, u, .7, .03, .6);
  const pk = pr(u, 1.4, .7), s = eOB(pk);
  if (pk > 0) {
    ctx.save(); ctx.translate(cx, 880); ctx.scale(s * (1 + kk * .03), s * (1 + kk * .03)); ctx.globalAlpha = cl(pk * 3);
    const w1 = measure('9–10', { size: 330, weight: 800, fam: 'N' }), w2 = measure('月', { size: 170, weight: 900 });
    const x0 = -(w1 + w2 + 10) / 2;
    ctx.save(); glow(P.teal, 40);
    txt('9–10', x0, 0, { size: 330, weight: 800, fam: 'N', align: 'left', color: P.white }); ctx.restore();
    txt('月', x0 + w1 + 10, -10, { size: 170, weight: 900, align: 'left', color: P.teal });
    ctx.restore();
  }
  // gradient title
  ctx.save();
  const gfill = grad(cx - 380, 0, cx + 380, 0, [P.teal, P.sky, P.violet]);
  charsIn('填報成績單', cx, 1090, { size: 160, weight: 900, color: gfill, ls: 12 }, u, 2.1, .08, .7);
  ctx.restore();
  charsIn('115年 藝文活動統計 · 數據快報', cx, 1190, { size: 40, weight: 500, color: P.white, ls: 6, alpha: .85 }, u, 2.9, .02, .5);
  // underline sweep
  const ul = eIOE(pr(u, 3.2, .8));
  fillRR(cx - 300 * ul, 1235, 600 * ul, 6, 3, P.amber);
  ctx.restore();
  // flash on drop
  const fl = pr(u, 4, .35); if (fl > 0 && fl < 1) { ctx.save(); ctx.globalAlpha = (1 - fl) * .25; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

function S2(t) { // overview 8-16
  const u = t - 8, ok = outK(u);
  title(u, '02', 'OVERVIEW', '9–10月 申報總覽', P.sky, '各機關於藝文網申報活動之審核結果');
  ctx.save(); ctx.translate(0, -ok * 120); ctx.globalAlpha = 1 - ok;
  // big count
  const ck = eOC(pr(u, .5, 1.6));
  charsIn('申報總件數', W / 2, 590, { size: 40, weight: 700, color: P.mute, ls: 10 }, u, .5, .04, .5);
  if (u > .5) {
    const sc = 1 + kick(t) * .025;
    ctx.save(); ctx.translate(W / 2, 830); ctx.scale(sc, sc); glow(P.sky, 50);
    txt(fmt(1033 * ck), -30, 0, { size: 280, weight: 800, fam: 'N', color: P.white, alpha: cl(pr(u, .5, .3)) });
    ctx.restore();
    txt('件', W / 2 + 290, 820, { size: 64, weight: 900, color: P.sky, alpha: cl(pr(u, 1.6, .3)) });
  }
  // stacked bar
  const bx = 90, bw = 900, by = 920, bh = 64;
  const tot = 1033, segs = [[962, P.teal], [41, P.coral], [30, P.amber]];
  fillRR(bx, by, bw * eOE(pr(u, 1.9, .6)), bh, 14, P.white, .08);
  let acc = 0;
  segs.forEach(([v, c], i) => {
    const k = eOE(pr(u, 2.1 + i * .25, .8));
    const w = bw * v / tot * k;
    ctx.save(); rr(bx, by, bw * eOE(pr(u, 1.9, .6)), bh, 14); ctx.clip();
    ctx.fillStyle = c; ctx.fillRect(bx + acc, by, w, bh); ctx.restore();
    acc += bw * v / tot * k;
  });
  // cards
  const cards = [['通過', 962, '93.1%', P.teal], ['退回', 41, '4.0%', P.coral], ['待審核', 30, '2.9%', P.amber]];
  cards.forEach(([lab, v, pct, c], i) => {
    const k = pr(u, 2.6 + i * .22, .7), e = eOB(k);
    const x = 90 + i * 310, y = 1040, w = 280, h = 320;
    if (k <= 0) return;
    ctx.save(); ctx.translate(x + w / 2, y + h); ctx.scale(1, e); ctx.translate(-(x + w / 2), -(y + h)); ctx.globalAlpha *= cl(k * 2);
    fillRR(x, y, w, h, 28, '#ffffff', .07); strokeRR(x, y, w, h, 28, c, 2, .6);
    fillRR(x + 30, y + 34, 46, 8, 4, c);
    txt(lab, x + 30, y + 98, { size: 44, weight: 900, align: 'left' });
    txt(fmt(v * eOC(pr(u, 2.8 + i * .22, 1.2))), x + 30, y + 230, { size: 120, weight: 800, fam: 'N', color: c, align: 'left' });
    txt('占 ' + pct, x + 30, y + 288, { size: 34, weight: 700, color: P.mute, align: 'left' });
    ctx.restore();
  });
  // highlight pill
  const hk = eOE(pr(u, 4.6, .7));
  if (hk > 0) {
    const w = 900 * hk;
    fillRR(W / 2 - w / 2, 1430, w, 130, 65, P.teal, .14); strokeRR(W / 2 - w / 2, 1430, w, 130, 65, P.teal, 3, .8);
    if (hk > .7) {
      check(W / 2 - 375, 1495, 44, pr(u, 5, .4), P.teal, 9);
      charsIn('通過率 93.1%　整體品質穩定', W / 2 + 40, 1515, { size: 48, weight: 900, ls: 2 }, u, 5.0, .03, .5);
    }
  }
  ctx.restore();
}

function S3(t) { // cumulative 16-24
  const u = t - 16, ok = outK(u);
  title(u, '03', 'YEAR TO DATE', '全年累計進度', P.teal, '115年累計通過數 vs. 114年同期');
  ctx.save(); ctx.translate(0, -ok * 120); ctx.globalAlpha = 1 - ok;
  const cx = W / 2, cy = 840, R = 250;
  const k = eIOC(pr(u, .5, 2.4)), pct = .805;
  arc(cx, cy, R, 0, Math.PI * 2, P.white, 46, 'butt', .08 * cl(u * 3));
  ctx.save(); ctx.setLineDash([2, 12]); arc(cx, cy, R + 50, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eOE(pr(u, .3, 1.5)), P.white, 14, 'butt', .25); ctx.restore();
  ctx.save(); glow(P.teal, 40);
  arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct * k, grad(cx - R, cy - R, cx + R, cy + R, [P.sky, P.teal]), 46, 'round');
  ctx.restore();
  // gap arc (the missing 19.5%)
  const gk = eOE(pr(u, 3, .8));
  if (gk > 0) { ctx.save(); ctx.setLineDash([10, 10]); arc(cx, cy, R, -Math.PI / 2 + Math.PI * 2 * pct + .06, -Math.PI / 2 + Math.PI * 2 * (pct + (1 - pct) * gk) - .02, P.coral, 46, 'butt', .7); ctx.restore(); }
  // head dot
  const ha = -Math.PI / 2 + Math.PI * 2 * pct * k;
  circle(cx + Math.cos(ha) * R, cy + Math.sin(ha) * R, 16 + kick(t) * 4, P.white, cl(u * 2));

// ---------- transitions (cover boundary at 8k) ----------
function transition(t) {
  const bounds = [8, 16, 24, 32, 40, 48, 56];
  for (let i = 0; i < bounds.length; i++) {
    const b = bounds[i], d = t - b;
    if (d < -.45 || d > .45) continue;
    const cin = eIOE(cl((d + .45) / .45)), cout = eIOE(cl(d / .45));
    const cols = [SECT_COL[i + 1], P.violet, P.bg0];
    const type = i % 3;
    ctx.save();
    if (type === 0) { // diagonal bars sweeping up
      cols.forEach((c, j) => {
        const lag = j * .12;
        const a = eIOE(cl((d + .45 - lag * .45) / .45 * (1 + lag)));
        const b2 = eIOE(cl((d - (2 - j) * .07) / .32));
        const top = lerp(H + 400, -400, a), bot = lerp(H + 400, -400, b2);
        if (top >= bot) return; // nothing
        ctx.fillStyle = c; ctx.beginPath();
        ctx.moveTo(0, top + 300); ctx.lineTo(W, top); ctx.lineTo(W, bot); ctx.lineTo(0, bot + 300); ctx.closePath(); ctx.fill();
      });
    } else if (type === 1) { // iris
      cols.forEach((c, j) => {
        const lag = j * .1;
        const a = eIOE(cl((d + .45 - lag) / (.45 - lag)));
        const r = a * 1250;
        const hole = eIOE(cl((d - (.2 - lag) * .5) / .35)) * 1250;
        if (r <= 0 || hole >= r) return;
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.moveTo(W / 2 + hole, H / 2); ctx.arc(W / 2, H / 2, hole, Math.PI * 2, 0, true); ctx.fill('evenodd');
      });
    } else { // vertical shutters
      const n = 6;
      for (let s = 0; s < n; s++) {
        const lag = s * .04;
        const a = eIOE(cl((d + .45 - lag) / .3)), b2 = eIOE(cl((d - lag) / .3));
        const x = s * W / n, w = W / n + 1;
        const top = (1 - a) * H, bot = H - b2 * H;
        const c = s % 2 ? cols[0] : cols[2];
        if (d < 0) { ctx.fillStyle = c; ctx.fillRect(x, top, w, H - top); }
        else { ctx.fillStyle = c; ctx.fillRect(x, 0, w, bot); }
      }
    }
    ctx.restore();
  }
}

// ---------- font preloading by collecting all glyphs ----------
async function prepare() {
  const all = new Set('0123456789,.%–/');

  ctx.fillText = function (s) { for (const ch of s) all.add(ch); };
  ctx.strokeText = function (s) { for (const ch of s) all.add(ch); };
  for (let t = 0; t < DUR; t += 1 / 15) render(t);
  ctx.fillText = orig; ctx.strokeText = origS;

  const jobs = [];
  for (const w of [500, 700, 900]) jobs.push(document.fonts.load(`${w} 40px "Noto Sans TC"`, str));
  for (const w of [600, 800]) jobs.push(document.fonts.load(`${w} 40px "Barlow Condensed"`, str));
