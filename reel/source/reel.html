<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-tc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter-tight/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/instrument-serif/400-italic.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DUR = 66.5, M = 80;
let FAST = false;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { bg: '#F1EEE7', ink: '#151515', ink2: '#5F5D58', faint: '#BAB5AA', rule: '#151515',
  blue: '#2442E6', orange: '#FF5A1F', yellow: '#FFCB2E', green: '#169C72', pink: '#F3B4C8', white: '#FFFFFF' };

// ---------- math ----------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, s, d) => cl((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const eO = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);       // expo out
const eQ = x => 1 - Math.pow(1 - x, 4);
const eIO = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eI = x => x * x * x * x;
const eB = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- type ----------
const FAM = { TC: '"Noto Sans TC"', N: '"Inter Tight","Noto Sans TC"', SI: '"Instrument Serif","Noto Sans TC"' };
function font(size, weight = 700, fam = 'TC') { ctx.font = `${fam === 'SI' ? 'italic ' : ''}${weight} ${size}px ${FAM[fam]}`; }
function txt(s, x, y, o = {}) {
  const { size = 60, weight = 700, fam = 'TC', color = P.ink, align = 'left', ls = 0, alpha = 1, stroke = 0 } = o;
  ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px'; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha *= alpha;
  if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = stroke; ctx.strokeText(s, x, y); } else { ctx.fillStyle = color; ctx.fillText(s, x, y); }
  ctx.restore();
}
function measure(s, o = {}) { const { size = 60, weight = 700, fam = 'TC', ls = 0 } = o; ctx.save(); font(size, weight, fam); ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// mask reveal of a whole line (slides up from beneath a clip), optional out
function line(s, x, y, o, t, start, dur = .8, out = null) {
  const size = o.size || 60;
  const k = eO(pr(t, start, dur)); if (k <= 0) return;
  let dy = (1 - k) * size * 1.15;
  if (out != null) dy -= eI(pr(t, out, .45)) * size * 1.15;
  const w = measure(s, o), al = o.align || 'left';
  const x0 = al === 'center' ? x - w / 2 : al === 'right' ? x - w : x;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, y - size * 1.05, w + 40, size * 1.32); ctx.clip();
  txt(s, x, y + dy, o); ctx.restore();
}
// per-character mask reveal
function chars(s, x, y, o, t, start, stagger = .03, dur = .7, out = null) {
  const size = o.size || 60, al = o.align || 'left';
  const total = measure(s, o);
  const x0 = al === 'center' ? x - total / 2 : al === 'right' ? x - total : x;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * 1.05, W, size * 1.32); ctx.clip();
  [...s].forEach((ch, i) => {
    const k = eO(pr(t, start + i * stagger, dur)); if (k <= 0) return;
    let dy = (1 - k) * size * 1.15;
    if (out != null) dy -= eI(pr(t, out + i * stagger * .4, .45)) * size * 1.15;
    txt(ch, x0 + measure(s.slice(0, i), o), y + dy, { ...o, align: 'left' });
  });
  ctx.restore();
}
function rect(x, y, w, h, c, a = 1) { if (w <= 0 || h <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); ctx.restore(); }
function srect(x, y, w, h, c, lw = 2, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); ctx.restore(); }
function rule(x0, y, x1, k, lw = 2, c = P.rule, a = 1) { if (k <= 0) return; rect(x0, y - lw / 2, (x1 - x0) * k, lw, c, a); }
function vrule(x, y0, y1, k, lw = 2, c = P.rule) { if (k <= 0) return; rect(x - lw / 2, y0, lw, (y1 - y0) * k, c); }
function circ(x, y, r, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function hatch(x, y, w, h, c, gap = 14, lw = 3) {
  if (w <= 0) return; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.strokeStyle = c; ctx.lineWidth = lw;
  for (let i = -h; i < w + h; i += gap) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); } ctx.restore();
}
function tick(x, y, s, k, c, lw = 7) { // geometric check
  if (k <= 0) return; ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
  const a = [x - s * .45, y], b = [x - s * .12, y + s * .32], c2 = [x + s * .5, y - s * .38];
  const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c2[0] - b[0], c2[1] - b[1]), d = k * (l1 + l2);
  ctx.beginPath(); ctx.moveTo(...a);
  if (d < l1) ctx.lineTo(lerp(a[0], b[0], d / l1), lerp(a[1], b[1], d / l1)); else { ctx.lineTo(...b); const q = (d - l1) / l2; ctx.lineTo(lerp(b[0], c2[0], q), lerp(b[1], c2[1], q)); }
  ctx.stroke(); ctx.restore();
}
// block that wipes in from a side
function wipe(x, y, w, h, c, k, dir = 'l') {
  if (k <= 0) return;
  if (dir === 'l') rect(x, y, w * k, h, c); else if (dir === 'r') rect(x + w * (1 - k), y, w * k, h, c);
  else if (dir === 'u') rect(x, y + h * (1 - k), w, h * k, c); else rect(x, y, w, h * k, c);
}
function tag(s, x, y, o, k, fill = null, col = P.ink) {
  if (k <= 0) return;
  const size = o.size || 24, w = measure(s, { ...o, size }) + size * 1.1, h = size * 1.7;
  ctx.save(); ctx.globalAlpha *= cl(k * 2);
  if (fill) rect(x, y - h + size * .45, w * eO(k), h, fill); else srect(x, y - h + size * .45, w * eO(k), h, col, 2);
  ctx.beginPath(); ctx.rect(x, y - h, w * eO(k), h * 2); ctx.clip();
  txt(s, x + size * .55, y, { ...o, size, color: fill ? (fill === P.yellow ? P.ink : P.white) : col });
  ctx.restore(); return w;
}
function barcode(x, y, h, k) {
  let cx = x; const n = 46;
  for (let i = 0; i < n; i++) { const w = 2 + Math.floor(hash(i * 3.3) * 4); if (i / n < k) rect(cx, y, w, h, P.ink); cx += w + 2 + Math.floor(hash(i * 7.1) * 3); }
  return cx - x;
}

// ---------- paper ----------
const paper = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = P.bg; x.fillRect(0, 0, W, H);
  const im = x.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(im, 0, 0); return c;
})();

// ---------- page chrome ----------
const SEC = ['', 'OVERVIEW', 'YEAR TO DATE', 'BY SYSTEM', 'TOP REPORTERS', 'ATTENTION', 'KEY POINTS', 'NEXT STEPS'];
const SCOL = [P.blue, P.blue, P.yellow, P.blue, P.orange, P.orange, P.yellow, P.blue];
function chrome(t) {
  if (t < 8.2 || t > 60.1) return;
  const a = Math.min(pr(t, 8.2, .5), 1 - pr(t, 59.6, .4));
  const si = Math.min(7, Math.floor(t / 8));
  ctx.save(); ctx.globalAlpha = a;
  txt('TAICHUNG ARTS REPORT', M, 160, { size: 26, weight: 800, fam: 'N', ls: 4 });
  txt('臺中市藝文網・9–10月填報特集', W - M, 160, { size: 24, weight: 700, color: P.ink2, align: 'right', ls: 2 });
  rect(M, 186, W - 2 * M, 5, P.ink);
  txt('P.' + String(si + 1).padStart(2, '0'), M, 1712, { size: 28, weight: 800, fam: 'N' });
  txt('VOL.115 — NO.09/10', M + 92, 1712, { size: 24, weight: 500, fam: 'N', color: P.ink2, ls: 2 });
  txt('統計至 115.10.31', W - M, 1712, { size: 24, weight: 500, color: P.ink2, align: 'right' });
  rect(M, 1672, W - 2 * M, 2, P.ink);
  // page progress ticks
  for (let i = 0; i < 8; i++) rect(W - M - (8 - i) * 22, 1652, 14, 6, i <= si ? P.ink : P.faint);
  ctx.restore();
}
// feature header
function header(u, si, en, zh, deck, zh2 = null) {
  const out = 7.2, c = SCOL[si];
  // giant outlined page number in background
  const bk = eQ(pr(u, .1, 1.2)), bo = eI(pr(u, out, .5));
  ctx.save(); ctx.globalAlpha = .9 * (1 - bo);
  txt(String(si + 1).padStart(2, '0'), W - M + 20 + (1 - bk) * 120, 760, { size: 420, weight: 800, fam: 'N', align: 'right', color: P.faint, stroke: 2.5, ls: -10 });
  ctx.restore();
  const k = eO(pr(u, .2, .6)), ko = eI(pr(u, out, .45));
  rect(M, 262, 26 * k, 26, c, 1 - ko);
  line(`FEATURE ${String(si).padStart(2, '0')} — ${en}`, M + 42, 286, { size: 26, weight: 600, fam: 'N', ls: 3 }, u, .25, .7, out);
  chars(zh, M - 4, 420, { size: 104, weight: 900, ls: -2 }, u, .35, .045, .75, out);
  if (zh2) chars(zh2, M - 4, 540, { size: 104, weight: 900, ls: -2, color: c === P.yellow ? P.ink : c }, u, .55, .045, .75, out);
  if (deck) line(deck, M, zh2 ? 610 : 495, { size: 30, weight: 500, color: P.ink2 }, u, .8, .8, out);
}
const outK = u => eI(pr(u, 7.15, .5));

// ================= SCENES =================
function S1(t) { // cover
  const u = t, out = 7.0;
  const ko = eI(pr(u, out, .6));
  ctx.save(); ctx.translate(0, -ko * 60); ctx.globalAlpha = 1 - ko;
  // masthead
  line('ISSUE 115 — 09/10', M, 168, { size: 26, weight: 600, fam: 'N', ls: 3 }, u, .2, .7);
  line('臺中市藝文網 數據特集', W - M, 168, { size: 26, weight: 700, align: 'right', ls: 2 }, u, .3, .7);
  rule(M, 194, W - M, eIO(pr(u, .1, .9)), 5);
  chars('ARTS', M - 10, 420, { size: 240, weight: 800, fam: 'N', ls: -12 }, u, .4, .07, .9);
  line('DATA', W - M, 340, { size: 70, weight: 800, fam: 'N', align: 'right', ls: -2, color: P.blue }, u, .9, .8);
  line('REPORT', W - M, 410, { size: 70, weight: 800, fam: 'N', align: 'right', ls: -2 }, u, 1.0, .8);
  // blue cover block
  const bk = eIO(pr(u, 1.0, 1.0));
  wipe(M, 470, W - 2 * M, 820, P.blue, bk, 'l');
  if (bk > .3) {
    ctx.save(); ctx.beginPath(); ctx.rect(M, 470, (W - 2 * M) * bk, 820); ctx.clip();
    chars('9–10', M + 34, 850, { size: 350, weight: 800, fam: 'N', color: P.white, ls: -18 }, u, 1.5, .08, .9);
    chars('月', M + 50, 1010, { size: 120, weight: 900, color: P.white }, u, 1.9, .05, .8);
    chars('填報大調查', M + 180, 1010, { size: 120, weight: 900, color: P.yellow, ls: -2 }, u, 2.0, .06, .8);
    line('藝文活動申報・審核・達成率 全解析', M + 44, 1090, { size: 34, weight: 700, color: P.white }, u, 2.5, .8);
    line('A close reading of Sep–Oct reporting', M + 44, 1150, { size: 44, weight: 400, fam: 'SI', color: P.white }, u, 2.7, .8);
    rule(M + 44, 1210, W - M - 44, eIO(pr(u, 2.8, .8)), 2, P.white);
    line('115年1–10月 累計 4,887 件', M + 44, 1258, { size: 30, weight: 700, color: P.white }, u, 3.0, .7);
    ctx.restore();
  }
  // sticker
  const sk = pr(u, 2.6, .6);
  if (sk > 0) {
    const s = eB(sk);
    ctx.save(); ctx.translate(W - M - 130, 560); ctx.rotate(.18 - .18 * eO(sk) + .08); ctx.scale(s, s);
    circ(0, 0, 136, P.yellow);
    txt('本期特集', 0, -40, { size: 30, weight: 900, align: 'center' });
    txt('1,033', 0, 40, { size: 84, weight: 800, fam: 'N', align: 'center', ls: -3 });
    txt('件 申報', 0, 86, { size: 26, weight: 700, align: 'center' });
    ctx.restore();
  }
  // cover lines
  const lines = [['01', '申報總覽', '通過率 93.1%'], ['02', '填報最多 TOP 8', '大墩文化中心 78 件奪冠'], ['03', '需注意的 4 件事', '區公所退回率 22%']];
  lines.forEach(([n, a, b], i) => {
    const st = 3.3 + i * .25, y = 1380 + i * 92;
    line(n, M, y, { size: 44, weight: 800, fam: 'N', color: P.blue }, u, st, .7);
    line(a, M + 80, y, { size: 38, weight: 900 }, u, st + .05, .7);
    line(b, M + 80 + measure(a, { size: 38, weight: 900 }) + 20, y, { size: 28, weight: 500, color: P.ink2 }, u, st + .1, .7);
    rule(M, y + 26, M + 640, eIO(pr(u, st, .8)), 1.5);
  });
  // barcode
  const bw = barcode(W - M - 230, 1400, 140, eIO(pr(u, 3.8, .9)));
  line('NO.09/10  2026', W - M - 230, 1578, { size: 22, weight: 600, fam: 'N', ls: 2 }, u, 4.2, .6);
  rule(M, 1650, W - M, eIO(pr(u, 3.6, 1)), 5);
  line('臺中市政府文化局 藝文網策進會議資料整理', M, 1700, { size: 24, weight: 500, color: P.ink2 }, u, 4.0, .7);
  ctx.restore();
}

function S2(t) { // overview
  const u = t - 8, ok = outK(u);
  header(u, 1, 'OVERVIEW', '申報總覽', '九至十月 各機關於藝文網申報活動之審核結果');
  ctx.save(); ctx.globalAlpha = 1 - ok; ctx.translate(0, -ok * 50);
  // big number
  line('TOTAL SUBMISSIONS', M, 600, { size: 24, weight: 600, fam: 'N', color: P.ink2, ls: 4 }, u, .9, .7);
  const ck = eQ(pr(u, 1.0, 1.6));
  line(fmt(1033 * ck), M - 8, 840, { size: 270, weight: 800, fam: 'N', ls: -12 }, u, 1.0, .8);
  line('件', M + 690, 830, { size: 80, weight: 900, color: P.blue }, u, 1.4, .7);
  // waffle 20x5
  const gx = M, gy = 900, cs = 41, gap = 4.6;
  for (let i = 0; i < 100; i++) {
    const c = i < 93 ? P.blue : i < 97 ? P.orange : P.yellow;
    const k = eO(pr(u, 1.7 + i * .012, .45)); if (k <= 0) continue;
    const x = gx + (i % 20) * (cs + gap), y = gy + Math.floor(i / 20) * (cs + gap);
    const s = cs * k; rect(x + (cs - s) / 2, y + (cs - s) / 2, s, s, c);
  }
  line('1 格 = 1%', W - M, 1160, { size: 22, weight: 500, color: P.ink2, align: 'right' }, u, 2.6, .6);
  // legend columns
  const cols = [['通過', 962, '93.1%', P.blue], ['退回', 41, '4.0%', P.orange], ['待審核', 30, '2.9%', P.yellow]];
  cols.forEach(([lab, v, pct, c], i) => {
    const x = M + i * 310, st = 2.7 + i * .2;
    if (i) vrule(x - 22, 1200, 1400, eIO(pr(u, st, .7)), 2);
    rect(x, 1210, 22 * eO(pr(u, st, .5)), 22, c);
    line(lab, x + 34, 1232, { size: 32, weight: 900 }, u, st, .7);
    line(fmt(v * eQ(pr(u, st, 1.3))), x - 4, 1350, { size: 110, weight: 800, fam: 'N', ls: -4 }, u, st + .05, .8);
    line(pct, x, 1395, { size: 30, weight: 600, fam: 'N', color: P.ink2 }, u, st + .1, .7);
  });
  // pull quote
  const hk = eIO(pr(u, 4.6, .7));
  rect(M, 1462, 560 * hk, 74, P.yellow);
  line('通過率 93.1%', M + 18, 1522, { size: 56, weight: 900 }, u, 4.8, .7);
  line('整體申報品質穩定。', M + 590, 1520, { size: 36, weight: 700 }, u, 5.0, .7);
  line('— Nine out of ten, approved.', M, 1600, { size: 38, weight: 400, fam: 'SI', color: P.ink2 }, u, 5.3, .8);
  ctx.restore();
}

function S3(t) { // year to date
  const u = t - 16, ok = outK(u);
  header(u, 2, 'YEAR TO DATE', '年度累計進度', '115年累計通過數 vs. 114年同期');
  ctx.save(); ctx.globalAlpha = 1 - ok; ctx.translate(0, -ok * 50);
  line('達去年同期', M, 600, { size: 34, weight: 900 }, u, .8, .7);
  const pk = eQ(pr(u, .9, 2));
  line((80.5 * pk).toFixed(1), M - 10, 880, { size: 300, weight: 800, fam: 'N', ls: -14 }, u, .9, .8);
  line('%', M + 650, 870, { size: 140, weight: 800, fam: 'N', color: P.yellow }, u, 1.2, .8);
  // 100% bar
  const by = 940, bh = 120, bw = W - 2 * M;
  const sk = eIO(pr(u, 1.4, .6));
  srect(M, by, bw * sk, bh, P.ink, 3);
  const fk = eIO(pr(u, 1.7, 1.4));
  rect(M, by, bw * .805 * fk, bh, P.yellow);
  if (fk >= .999) hatch(M + bw * .805, by, bw * .195 * eIO(pr(u, 3.1, .6)), bh, P.orange, 14, 3);
  vrule(M + bw * .805, by - 20, by + bh + 20, eIO(pr(u, 3.0, .4)), 3);
  line('GAP 19.5%', W - M, by + bh + 50, { size: 26, weight: 800, fam: 'N', color: P.orange, align: 'right', ls: 2 }, u, 3.2, .6);
  line('0', M, by + bh + 50, { size: 24, weight: 600, fam: 'N', color: P.ink2 }, u, 1.6, .6);
  // two columns
  const cols = [['115年 累計通過', 4887, P.ink], ['114年 同期通過', 6069, P.ink2]];
  cols.forEach(([lab, v, c], i) => {
    const x = M + i * 470, st = 2.2 + i * .2;
    if (i) vrule(x - 30, 1180, 1340, eIO(pr(u, st, .7)), 2);
    line(lab, x, 1220, { size: 30, weight: 700, color: P.ink2 }, u, st, .7);
    line(fmt(v * eQ(pr(u, st, 1.3))), x - 4, 1330, { size: 110, weight: 800, fam: 'N', color: c, ls: -4 }, u, st + .05, .8);
  });
  rule(M, 1380, W - M, eIO(pr(u, 3.5, .8)), 2);
  // callouts
  [['−1,182', '落後去年同期'], ['−1,895', '距114年全年 6,782 件']].forEach(([n, s], i) => {
    const x = M + i * 470, st = 3.8 + i * .3;
    line(n, x - 4, 1500, { size: 96, weight: 800, fam: 'N', color: P.orange, ls: -3 }, u, st, .8);
    line(s, x, 1556, { size: 30, weight: 700 }, u, st + .1, .7);
  });
  ctx.restore();
}

function S4(t) { // systems
  const u = t - 24, ok = outK(u);
  header(u, 3, 'BY SYSTEM', '各系統通過件數', '9–10月通過件數｜右欄為累計達成率（對比去年同期）');
  ctx.save(); ctx.globalAlpha = 1 - ok; ctx.translate(0, -ok * 50);
  rule(M, 560, W - M, eIO(pr(u, .7, .8)), 2);
  const rows = [['市立圖書館', 422, 443, 78.5], ['文化局＋文資處＋市美館', 369, 383, 90.5], ['區公所', 90, 125, 80.5], ['一級機關', 69, 69, 75.0], ['其他', 12, 13, 71.0], ['通訊員', 0, 0, 38.5]];
  rows.forEach(([name, v, sub, rate], i) => {
    const y = 620 + i * 132, st = .8 + i * .16;
    line(name, M, y + 10, { size: 36, weight: 900 }, u, st, .7);
    line('申報 ' + sub, M + measure(name, { size: 36, weight: 900 }) + 14, y + 10, { size: 24, weight: 500, color: P.ink2 }, u, st + .05, .7);
    const k = eIO(pr(u, st + .15, 1.0)), w = Math.max(8, 640 * v / 422);
    const c = i < 2 ? P.blue : v === 0 ? P.orange : P.ink;
    rect(M, y + 30, w * k, 44, c);

function S5(t) { // top 8

function S6(t) { // attention

  // two black tiles

    const x = M + i * 470, w = 450, y = 660, st = .8 + i * .2;

      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, 300); ctx.clip();

      line(s, x + 30, y + 280, { size: 24, weight: 500, color: P.white }, u, st + .6, .6);

  // squares grid 49
  const gx = M, gy = 1020, cs = 30, gp = 8;
  const lit = [3, 9, 17, 22, 26, 29, 31, 38, 40, 46];
  for (let i = 0; i < 49; i++) {
    const k = eO(pr(u, 2.3 + i * .014, .4)); if (k <= 0) continue;
    const x = gx + (i % 7) * (cs + gp), y = gy + Math.floor(i / 7) * (cs + gp), s = cs * k;
    if (lit.includes(i)) rect(x + (cs - s) / 2, y + (cs - s) / 2, s, s, P.ink);
    else srect(x + (cs - s) / 2 + 1.5, y + (cs - s) / 2 + 1.5, s - 3, s - 3, P.orange, 3);

  ['東區', '南屯', '清水', '大肚', '大雅', '后里', '龍井', '和平'].forEach((s, i) => {
    const x = M + (i % 4) * 232, y = 1470 + Math.floor(i / 4) * 88;
    const k = pr(u, 4.6 + i * .08, .5); if (k <= 0) return;

}

function S7(t) { // key points
  const u = t - 48, ok = outK(u);

    line(head, M + 140, y + 80, { size: 40, weight: 900 }, u, st + .1, .7);

    // sub text wraps into two lines if long
    const parts = sub.length > 22 ? [sub.slice(0, sub.indexOf('，') > 0 ? sub.indexOf('，') + 1 : sub.indexOf('・') + 1), sub.slice(sub.indexOf('，') > 0 ? sub.indexOf('，') + 1 : sub.indexOf('・') + 1)] : [sub];
    parts.forEach((p, j) => line(p, M + 140, y + 140 + j * 42, { size: 28, weight: 500, color: P.ink2 }, u, st + .3 + j * .08, .7));

      const y = 760 + i * 240, st = .8 + i * .35;

      chars('攜手', M - 8, 760, { size: 260, weight: 900, color: P.white, ls: -8 }, u, 4.4, .08, .8);

  if (u >= 8) { // back cover
    rule(M, 194, W - M, eIO(pr(u, 8.1, .8)), 5);
    chars('ARTS', M - 12, 520, { size: 270, weight: 800, fam: 'N', ls: -14 }, u, 8.2, .06, .8);
    line('DATA REPORT', M, 600, { size: 54, weight: 800, fam: 'N', color: P.blue, ls: -1 }, u, 8.4, .7);
    line('臺中市藝文網', M, 800, { size: 92, weight: 900, ls: -2 }, u, 8.5, .8);
    line('115年 9–10月 填報特集', M, 880, { size: 44, weight: 700, color: P.ink2 }, u, 8.65, .7);
    rule(M, 940, W - M, eIO(pr(u, 8.7, .8)), 2);

    barcode(M, 1500, 120, eIO(pr(u, 8.8, .8)));
    rule(M, 1650, W - M, eIO(pr(u, 8.9, .8)), 5);
  }
}

// ---------- page-turn transitions ----------
function transition(t) {
  [8, 16, 24, 32, 40, 48, 56].forEach((b, i) => {
    const d = t - b; if (d < -.5 || d > .55) return;
    const c1 = SCOL[i + 1], c2 = P.ink;
    const vertical = i % 2 === 1;
    const a = eIO(pr(d, -.5, .5)), z = eIO(pr(d, 0, .5));
    const a2 = eIO(pr(d, -.42, .45)), z2 = eIO(pr(d, .06, .45));
    if (!vertical) {
      // panels sweep right->left
      const x0 = W * (1 - a), x1 = W * (1 - z);
      rect(Math.min(x0, x1) * 0 + W * (1 - a), 0, W * (a - z), H, c1);
      rect(W * (1 - a2), 0, W * (a2 - z2), H, c2);
      if (a2 - z2 > .05) txt('P.' + String(i + 2).padStart(2, '0'), W * (1 - a2) + 80, H / 2 + 40, { size: 120, weight: 800, fam: 'N', color: P.white, ls: -4 });
    } else {
      rect(0, H * (1 - a), W, H * (a - z), c1);
      rect(0, H * (1 - a2), W, H * (a2 - z2), c2);
      if (a2 - z2 > .05) txt('P.' + String(i + 2).padStart(2, '0'), M, H * (1 - a2) + 200, { size: 120, weight: 800, fam: 'N', color: P.white, ls: -4 });
    }
  });
}

const SCENES = [S1, S2, S3, S4, S5, S6, S7, S8];
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  if (!FAST) ctx.drawImage(paper, 0, 0); else { ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); }
  const si = Math.min(7, Math.floor(t / 8));
  SCENES[si](t);
  chrome(t);
  transition(t);
  const ff = pr(t, 65.7, .8); if (ff > 0) { ctx.fillStyle = `rgba(241,238,231,${ff})`; ctx.fillRect(0, 0, W, H); }
}

async function prepare() {
  const all = new Set('0123456789,.%–/<>−');
  const of = ctx.fillText, os = ctx.strokeText;
  ctx.fillText = function (s) { for (const ch of s) all.add(ch); }; ctx.strokeText = ctx.fillText;
  FAST = true; for (let t = 0; t < DUR; t += 1 / 10) render(t); FAST = false;
  ctx.fillText = of; ctx.strokeText = os;
  const str = [...all].join('');
  await Promise.all([
    ...[500, 700, 900].map(w => document.fonts.load(`${w} 40px "Noto Sans TC"`, str)),
    ...[500, 600, 800].map(w => document.fonts.load(`${w} 40px "Inter Tight"`, str)),
    document.fonts.load(`italic 400 40px "Instrument Serif"`, str),
  ]);
  await document.fonts.ready;
  window.__ready = true;
}
window.render = render;
prepare();
